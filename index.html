a Histórico-Crítica)."], ["CT", "Conhecimento Tecnológico", "Planilha (LibreOffice Calc / Google Sheets) com modelo pronto; Canva para o infográfico, inclusive pelo celular; consulta a portais de transparência."], ["CD", "Conhecimento de Design (DUA)", "Material prévio em mais de um formato; modelos de planilha com legenda dupla cor+texto; duplas com papéis alternados para lidar com o letramento digital desigual (Representação e Engajamento, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Parte do letramento digital desigual e da falta de tempo de planejamento coletivo; relaciona o orçamento público a direitos sociais e ao controle social da gestão pública. Examina quem mais depende dos serviços públicos (classe) e se as políticas atingem de modo diferente mulheres e homens (gênero). Pergunta para a roda: Que serviço público da comunidade pesa mais na vida de quem tem menos renda?"]], "seq": [["1", "Estudo prévio (texto, áudio ou vídeo) e roda de conversa sobre serviço público e orçamento", "6h"], ["2", "Construção guiada da planilha de receitas e despesas de um serviço público simulado", "12h"], ["3", "Análise de dados de um portal de transparência e produção do infográfico para a comunidade", "12h"]], "aval": "Planilha com fórmulas corretas, interpretação dos dados e infográfico claro e acessível; autoavaliação do processo. Entrega aceita em formato digital, impresso ou oral.", "mat": "Computador ou celular com acesso a planilha e ao Canva; modelo de planilha em branco; roteiro de leitura prévia (texto, áudio e vídeo curto); dados de um portal de transparência, também impressos ou salvos para uso offline.", "prep": "~2h", "dcn": "Tecnologia (planilhas e dados públicos) como fio condutor dos saberes da gestão pública (Art. 3º, VI), articulada à formação humana integral: orçamento, direitos e controle social."}, {"eixo": "Turismo, Hospitalidade e Lazer", "title": "Turismo, Hospitalidade e Lazer", "sub": "Gastronomia — ECIT Dr. Elpídio de Almeida", "tema": "Ficha o educativo e a cadeia produtiva regional como contexto."}, {"eixo": "Produção Cultural e Design", "title": "Design de Calçados", "sub": "ECIT Prof. Bráulio Maia Júnior — curso mapeado no universo da pesquisa, sem docente respondente na amostra", "tema": "Modelagem Digital e Prototipagem de Calçados (30h).", "obj": ["Aplicar princípios de modelagem digital a um produto calçadista.", "Relacionar a tradição do polo calçadista local à inovação digital.", "Produzir um protótipo digital dialogando com um artesão da região."], "tp": [["CC", "Conhecimento do Conteúdo", "Composição de modelagem, materiais e estrutura do calçado; princípios de prototipagem."], ["CP", "Conhecimento Pedagógico", "Pesquisa-ação com artesão local: a tecnologia como potencializadora do saber tácito, não como substituta."], ["CT", "Conhecimento Tecnológico", "Inkscape (vetor, software livre); Blender ou SketchUp na fase de modelagem 3D."], ["CD", "Conhecimento de Design (DUA)", "Amostras físicas/táteis de material e textura; tutoriais em texto/vídeo com legenda (Representação e Engajamento, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Diálogo entre a tradição do polo calçadista local e a inovação digital, sem desvalorizar o saber artesanal e histórico da região. Discute a dualidade entre quem concebe e quem produz o calçado no polo local, com recortes de classe e de gênero. Pergunta para a roda: Quem projeta, quem produz e quem é valorizado?"]], "seq": [["1", "Entrevista com artesão ou profissional do polo calçadista local", "6h"], ["2", "Modelagem digital do produto em Inkscape/Blender", "16h"], ["3", "Apresentação do protótipo com reflexão sobre sustentabilidade e impacto socioambiental", "8h"]], "aval": "Protótipo digital apresentado com justificativa das escolhas de modelagem e da relação estabelecida com o saber artesanal local.", "mat": "Computador com Inkscape e Blender/SketchUp (softwares gratuitos); registro da entrevista com o artesão; amostras físicas de material para consulta tátil.", "prep": "~2h30", "dcn": "Tecnologia (modelagem digital) como fio condutor do saber calçadista (Art. 3º, VI), em diálogo com o saber artesanal do território (trabalho como princípio educativo)."}, {"eixo": "Produção Cultural e Design", "title": "Design Gráfico", "sub": "ECIT Prof. Bráulio Maia Júnior", "tema": "Projeto Editorial e Identidade Visual (30h).", "obj": ["Desenvolver peças de um projeto editorial (catálogo) para uma empresa fictícia.", "Aplicar composição visual, paleta de cores e tipografia de forma coerente.", "Refletir sobre o impacto social e ético das escolhas de design realizadas."], "tp": [["CC", "Conhecimento do Conteúdo", "Composição visual, paleta de cores, tipografia e organização de informações em peças editoriais."], ["CP", "Conhecimento Pedagógico", "Aproximação das demandas reais do mercado de design, com incentivo à pesquisa, criatividade, trabalho colaborativo e reflexão sobre o impacto social e ético das escolhas de design."], ["CT", "Conhecimento Tecnológico", "Photoshop, CorelDRAW e Canva para composição e tratamento de imagens; IbisPaint como alternativa de ilustração."], ["CD", "Conhecimento de Design (DUA)", "Roteiros simplificados, orientações passo a passo e alternativas de ferramentas, respeitando o ritmo e o nível de acesso tecnológico de cada estudante (Engajamento e Representação, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "O design gráfico como campo de decisões éticas: quais imagens, textos e representações uma peça de catálogo reforça ou questiona. Analisa quem é representado nas peças (classe, gênero, raça) e a distância entre quem concebe e quem executa o trabalho de design. Pergunta para a roda: Quem aparece no catálogo? Quem fica de fora?"]], "seq": [["1", "Pesquisa e planejamento do catálogo da empresa fictícia", "6h"], ["2", "Criação das peças (Photoshop/CorelDRAW/Canva)", "18h"], ["3", "Apresentação com reflexão sobre o impacto social e ético das escolhas de design", "6h"]], "aval": "Catálogo entregue com coerência visual e tipográfica, avaliando também a profundidade da reflexão sobre o impacto social das escolhas de design apresentada pelo estudante.", "mat": "Computador com Photoshop, CorelDRAW ou Canva; alternativas gratuitas indicadas para estudantes sem acesso às licenças pagas; roteiro simplificado de orientação passo a passo.", "prep": "~1h30", "dcn": "Tecnologia (composição visual) como fio condutor do saber editorial (Art. 3º, VI), com decisões de design discutidas à luz da formação humana integral e da responsabilidade social."}, {"eixo": "Produção Cultural e Design", "title": "Comunicação e Publicidade", "sub": "ECIT Prof. Bráulio Maia Júnior", "tema": "Campanha Publicitária e Comunicação Responsável (30h).", "obj": ["Elaborar peças de campanha publicitária a partir de um briefing profissional simulado.", "Identificar estereótipos, vieses e impactos sociais nas escolhas de linguagem e imagem.", "Justificar decisões de comunicação a partir de critérios éticos e de responsabilidade social."], "tp": [["CC", "Conhecimento do Conteúdo", "Estrutura de uma campanha publicitária (briefing, público-alvo, conceito criativo, peças gráficas e audiovisuais)."], ["CP", "Conhecimento Pedagógico", "Situações próximas da realidade profissional do mercado publicitário, articuladas a reflexões sobre ética, responsabilidade social, respeito às diferenças e impacto da comunicação na sociedade."], ["CT", "Conhecimento Tecnológico", "Canva para identidade visual e peças gráficas; CapCut para vídeos curtos; Mentimeter para testar a recepção do conceito com a turma."], ["CD", "Conhecimento de Design (DUA)", "Roteiros e instruções simplificadas; materiais com organização visual clara, contraste adequado e fontes legíveis; recursos audiovisuais com legendas (Representação, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "A publicidade como campo de disputa simbólica — quem é representado, quais estereótipos são reforçados ou combatidos nas peças produzidas pela turma. Analisa es emas a partir de casos reais de plataformização do trabalho (apps de entrega/transporte)."], ["CT", "Conhecimento Tecnológico", "Scratch / App Inventor (offline-first); Replit para transição a Python."], ["CD", "Conhecimento de Design (DUA)", "Contraste ampliado, leitor de tela (NVDA), fluxogramas com áudio-descrição (Representação, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "O algoritmo discutido como artefato social: soberania tecnológica e precarização do trabalho por plataforma. Discute a dualidade entre quem cria as plataformas e quem trabalha sob as regras delas, e a presença desigual de mulheres e de pessoas de baixa renda na tecnologia. Pergunta para a roda: Quem escreve as regras do algoritmo?"]], "seq": [["1", "Problematização com caso real de algoritmo de plataforma", "4h"], ["2", "Construção progressiva de algoritmos (Scratch/App Inventor/Replit)", "28h"], ["3", "Protótipo em duplas + texto-síntese sobre ética algorítmica", "8h"]], "aval": "Protótipo funcional apresentado em duplas, avaliando corretude da lógica construída e qualidade do texto-síntese sobre ética algorítmica.", "mat": "Computadores com acesso a Scratch, App Inventor ou Replit (todos gratuitos); leitor de tela NVDA disponível no laboratório; roteiro do caso real de plataformização para a problematização inicial.", "prep": "~2h", "dcn": "Tecnologia (algoritmos e prototipagem) como fio condutor dos saberes da programação (Art. 3º, VI), discutindo plataformização e soberania tecnológica à luz da formação humana integral."}, {"eixo": "Informação e Comunicação", "title": "Programação de Jogos", "sub": "Eixo Informação e Comunicação — ECIT Prof. Bráulio Maia Júnior", "tema": "Lógica de Jogos 2D: Movimento, Colisão e Cooperação em Projetos (40h).", "obj": ["Programar movimentação e colisão 2D, relacionando vetores e física à lógica orientada a objetos.", "Desenvolver em duplas um protótipo de jogo a partir de um problema real da comunidade escolar.", "Refletir sobre inclusão e ética no design de jogos."], "tp": [["CC", "Conhecimento do Conteúdo", "Vetores, física de colisões 2D, scripts de movimento e orientação a objetos; ciclo de um protótipo de jogo (ideia, versão jogável e teste)."], ["CP", "Conhecimento Pedagógico", "Aprendizagem Baseada em Projetos com live coding em sala e peer instruction (duplas de aprendizado cooperativo); problematização inicial sobre que jogo a comunidade precisa e para quem."], ["CT", "Conhecimento Tecnológico", "Unity ou Godot Engine (alternativa mais leve para máquinas com hardware limitado) e editor de código; roteiros passo a passo offline."], ["CD", "Conhecimento de Design (DUA)", "Escolha do motor conforme a máquina; roteiros offline; duplas com papéis definidos; contraste ampliado e leitor de tela (NVDA) nos materiais (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Computadores obsoletos e falta de dispositivos próprios orientam a escolha de ferramentas e atividades; o jogo é discutido como produto cultural: quem joga e quem fica de fora. Examina também quem é representado nos jogos e quem tem acesso a desenvolvê-los (classe, gênero), na dualidade entre desenvolver e apenas consumir. Pergunta para a roda: Quem desenvolve e quem apenas consome?"]], "seq": [["1", "Problematização (que jogo e para quem?) e primeiro protótipo de movimento com live coding", "8h"], ["2", "Colisão e física 2D em duplas, com peer instruction", "16h"], ["3", "Protótipo do jogo e teste (playtest) com a turma", "12h"], ["4", "Apresentação dos jogos e reflexão sobre inclusão e ética", "4h"]], "aval": "Protótipo funcional em duplas, com movimento e colisão corretos, registro do processo de desenvolvimento e texto curto de reflexão sobre inclusão e ética do jogo.", "mat": "Computadores do laboratório com Godot Engine ou Unity; roteiros passo a passo offline (impressos ou em PDF); NVDA disponível no laboratório; instaladores em pen drive para quem tem pouca conexão.", "prep": "~3h", "dcn": "Tecnologia (motores de jogo e física 2D) como fio condutor dos saberes da programação de jogos (Art. 3º, VI), com projetos cooperativos ligados a necessidades reais da comunidade."}, {"eixo": "Informação e Comunicação", "title": "Desenvolvimento de Sistemas (variação avançada)", "adv": true, "sub": "Eixo Informação e Comunicação — ECIT Elpídio de Almeida", "tema": "Programação em Python: dados, funções e regras de plataforma (40h).", "obj": ["Escrever programas em Python com estruturas de decisão, repetição, funções, listas e dicionários.", "Simular uma regra de pagamento de plataforma sobre dados fictícios e discutir seus efeitos sobre o trabalhador.", "Documentar o código e fazer revisão por pares, produzindo em duplas um programa e um texto-síntese sobre ética algorítmica."], "tp": [["CC", "Conhecimento do Conteúdo", "Variáveis, decisão e repetição, funções, listas e dicionários, leitura de arquivos, depuração e documentação do código."], ["CP", "Conhecimento Pedagógico", "Aprendizagem Baseada em Problemas a partir de regras reais de plataformização do trabalho, com revisão de código por pares (code review) e discussão crítica de quem define a regra."], ["CT", "Conhecimento Tecnológico", "Python no Google Colab (com conexão) ou no Thonny / Visual Studio Code (offline); Replit como alternativa; arquivos de dados em CSV baixados antes da aula."], ["CD", "Conhecimento de Design (DUA)", "Exemplos prontos para modificar, código comentado, instruções numeradas, alternativa offline para a atividade no Colab e compatibilidade com NVDA (Representação, Engajamento, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "A regra do algoritmo como decisão humana e social: precarização do trabalho por plataforma, opacidade das regras e a dualidade entre quem escreve o código e quem trabalha sob ele, com recortes de classe e de gênero na área de tecnologia. Parte do acesso desigual a computador e conexão, com alternativas offline. Pergunta para a roda: Quem escreve as regras do algoritmo?"]], "seq": [["1", "Problematização: caso real de regra de pagamento de plataforma e leitura de dados fictícios", "4h"], ["2", "Python básico: variáveis, decisão e repetição, com exemplos para modificar", "12h"], ["3", "Funções, listas e dicionários, leitura de arquivo CSV e depuração", "12h"], ["4", "Projeto em duplas: simulador da regra de plataforma, revisão por pares e texto-síntese sobre ética algorítmica", "12h"]], "aval": "Programa funcional e documentado, participação na revisão por pares e qualidade do texto-síntese. A explicação da lógica pode ser escrita ou oral.", "mat": "Computadores com Python (Thonny ou VS Code instalados) ou acesso ao Colab; NVDA no laboratório; arquivos CSV e roteiros impressos ou em pen drive para quem tem pouca conexão.", "prep": "~2h30", "dcn": "Tecnologia (programação e dados) como fio condutor dos saberes da área (Art. 3º, VI), com o trabalho como princípio educativo (Art. 3º, IV)."}, {"eixo": "Informação e Comunicação", "title": "Desenvolvimento de Sistemas: Banco de Dados", "sub": "Banco ampliado · Desenvolvimento de Sistemas · sugestão não validada na pesquisa", "tema": "Modelagem de Banco de Dados a partir de um cadastro real da escola (40h).", "obj": ["Identificar entidades, atributos e relacionamentos em uma situação real.", "Construir o modelo no papel e implementá-lo em tabelas com consultas SQL básicas.", "Discutir quem controla os dados e como protegê-los (LGPD)."], "tp": [["CC", "Conhecimento do Conteúdo", "Entidade, atributo, chave primária e estrangeira; relacionamento 1:N; comandos SELECT, INSERT e WHERE em SQL."], ["CP", "Conhecimento Pedagógico", "Aprendizagem Baseada em Problemas: a turma recebe o problema da biblioteca ou do controle de merenda da escola e propõe o modelo antes de ver qualquer comando."], ["CT", "Conhecimento Tecnológico", "Papel e lápis (modelagem), LibreOffice Base ou SQLite Online (gratuitos); planilha como ponto de partida."], ["CD", "Conhecimento de Design (DUA)", "Modelo desenhado em papel antes do digital; roteiro em texto, áudio e vídeo com legenda; entrega em diagrama, tabela ou oral (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Dados de estudantes e famílias são poder: quem coleta, quem acessa e quem é exposto? Em escolas com poucos computadores, o trabalho em papel e em duplas garante que todos participem. Pergunta para a roda: quem decide quais dados valem a pena guardar?"]], "seq": [["1", "Levantamento do problema e modelagem em papel (entidades e relações)", "12h"], ["2", "Implementação das tabelas e consultas SQL em duplas", "20h"], ["3", "Teste com dados reais fictícios e debate sobre LGPD e privacidade", "8h"]], "aval": "Modelo e consultas funcionando, com justificativa das escolhas e identificação dos dados sensíveis.", "mat": "Papel, quadro, computador com LibreOffice Base (gratuito) ou SQLite online; planilha-modelo com 20 linhas de dados fictícios.", "prep": "~3h", "dcn": "Articula conhecimento técnico (dados) ao mundo do trabalho e à cidadania digital, com discussão crítica da proteção de dados.", "ext": true}, {"eixo": "Informação e Comunicação", "title": "Desenvolvimento de Sistemas: Desenvolvimento Web", "sub": "Banco ampliado · Desenvolvimento de Sistemas · sugestão não validada na pesquisa", "tema": "Página web de utilidade pública para a comunidade com HTML e CSS (40h).", "obj": ["Estruturar uma página com HTML semântico (títulos, listas, imagens com texto alternativo).", "Aplicar CSS com contraste e leitura adequados em telas pequenas.", "Publicar e testar a página no celular e com leitor de tela."], "tp": [["CC", "Conhecimento do Conteúdo", "HTML semântico, CSS básico, responsividade, texto alternativo e contraste; noções de acessibilidade web."], ["CP", "Conhecimento Pedagógico", "Projeto: a turma escolhe uma necessidade local (horário do transporte, feira, serviço de saúde), entrevista quem usa e entrega uma página útil."], ["CT", "Conhecimento Tecnológico", "Editor de texto simples ou VS Code; navegador com ferramentas do desenvolvedor; GitHub Pages ou similar para publicar (gratuitos)."], ["CD", "Conhecimento de Design (DUA)", "Teste da própria página com teclado e leitor de tela (NVDA); material em texto, vídeo legendado e exemplo pronto (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Páginas pensadas só para quem tem computador e internet boa excluem parte da comunidade. Testar no celular e com pouca conexão faz parte do projeto. Pergunta para a roda: quem consegue usar o que construímos e quem fica de fora?"]], "seq": [["1", "Entrevista com usuários e rascunho em papel da página", "8h"], ["2", "Construção em HTML e CSS, com revisão em duplas", "24h"], ["3", "Publicação, teste com leitor de tela e no celular e apresentação", "8h"]], "aval": "Página publicada, com estrutura semântica, texto alternativo e teste de acessibilidade registrado pela dupla.", "mat": "Computadores ou celulares com editor de texto; internet para publicar; arquivos de apoio baixados antes da aula (plano B offline).", "prep": "~3h", "dcn": "Projeto com intencionalidade social, ligando tecnologia, trabalho e território (trabalho como princípio educativo).", "ext": true}, {"eixo": "Informação e Comunicação", "title": "Desenvolvimento de Sistemas: Ética em Algoritmos", "sub": "Banco ampliado · Desenvolvimento de Sistemas · sugestão não validada na pesquisa", "tema": "Algoritmos que decidem: lógica, vieses e responsabilidade (30h).", "obj": ["Escrever um algoritmo de decisão (aprovar, ordenar, recomendar) em pseudocódigo e em código.", "Identificar como regras mal pensadas podem excluir pessoas.", "Propor uma regra mais justa e justificá-la."], "tp": [["CC", "Conhecimento do Conteúdo", "Estruturas condicionais, listas e critérios de ordenação; viés em dados e regras; transparência de algoritmos."], ["CP", "Conhecimento Pedagógico", "Problematização crítica: parte de um caso real de decisão automatizada, discute quem decide e quem é afetado, e só depois programa a alternativa."], ["CT", "Conhecimento Tecnológico", "Scratch ou Python no Google Colab ou Replit (gratuitos); planilha para simular dados; cartões de papel para a versão desplugada."], ["CD", "Conhecimento de Design (DUA)", "Versão desplugada com cartões antes do código; o mesmo caso em texto, áudio e vídeo com legenda; entrega escrita, oral ou em fluxograma (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Sistemas de pontuação e seleção já afetam crédito, vagas e emprego. A turma discute classe, gênero e território nos dados usados. Pergunta para a roda: quem projeta o algoritmo e quem sofre os efeitos?"]], "seq": [["1", "Caso real e leitura crítica em grupos (quem decide, quem é afetado)", "8h"], ["2", "Construção do algoritmo em pseudocódigo e código, versão inicial e versão revisada", "16h"], ["3", "Debate final e proposta de regra mais justa", "6h"]], "aval": "Algoritmo funcionando, com texto curto explicando o critério adotado e o possível impacto sobre grupos diferentes.", "mat": "Computador ou celular com Scratch ou Colab; cartões de papel; texto-base curto sobre o caso.", "prep": "~2h30", "dcn": "Formação técnica com leitura crítica da tecnologia e do mundo do trabalho, sem tratá-la como neutra.", "ext": true}, {"eixo": "Informação e Comunicação", "title": "Programação de Jogos Digitais: Jogo Educativo", "sub": "Banco ampliado · Programação de Jogos Digitais · sugestão não validada na pesquisa", "tema": "Criação de um jogo educativo curto sobre um conteúdo da escola (40h).", "obj": ["Definir regras, objetivo e feedback de um jogo simples.", "Programar pontuação, níveis e mensagens de acerto e erro.", "Testar com colegas de outra turma e ajustar o jogo."], "tp": [["CC", "Conhecimento do Conteúdo", "Loop de jogo, variáveis de pontuação, condicionais, eventos de entrada; noções de game design (meta, regra, feedback)."], ["CP", "Conhecimento Pedagógico", "Aprendizagem baseada em projetos: a turma escolhe um conteúdo de outro componente e cria o jogo para ensiná-lo a colegas."], ["CT", "Conhecimento Tecnológico", "Scratch ou GDevelop (gratuitos); papel para o protótipo do jogo (storyboard)."], ["CD", "Conhecimento de Design (DUA)", "Protótipo em papel antes do digital; instruções em texto, áudio e vídeo curto com legenda; modos de jogar com teclado, toque ou mouse (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Jogos educativos podem reproduzir só a lógica de competição. A turma discute cooperação, ritmo diferente de cada estudante e acesso a computadores. Pergunta para a roda: para quem o jogo foi pensado e quem ficaria de fora?"]], "seq": [["1", "Escolha do conteúdo, regras e protótipo em papel", "8h"], ["2", "Programação do jogo em duplas, com versões salvas a cada etapa", "24h"], ["3", "Teste com outra turma, coleta de feedback e ajustes", "8h"]], "aval": "Jogo jogável, com regras claras e registro do teste: o que funcionou, o que confundiu e o que foi mudado.", "mat": "Computadores com Scratch ou GDevelop (ou versão online); papel e canetas; arquivos salvos com frequência.", "prep": "~3h", "dcn": "Projeto que integra conteúdo técnico, trabalho coletivo e utilidade para a comunidade escolar.", "ext": true}, {"eixo": "Informação e Comunicação", "title": "Programação de Jogos Digitais: Arte e Som para Jogos", "sub": "Banco ampliado · Programação de Jogos Digitais · sugestão não validada na pesquisa", "tema": "Recursos visuais e sonoros livres e a autoria em jogos (30h).", "obj": ["Criar ou escolher imagens e sons com licença livre para um jogo.", "Entender licenças (Creative Commons) e direito autoral.", "Integrar arte e som ao jogo sem prejudicar a acessibilidade."], "tp": [["CC", "Conhecimento do Conteúdo", "Sprites, resolução, formatos de imagem e áudio, licenças Creative Commons; legendas e alternativas sonoras para eventos do jogo."], ["CP", "Conhecimento Pedagógico", "Problematização: quem cria a arte e o som dos jogos, quem é pago e quem é creditado? A turma parte disso para produzir os próprios recursos."], ["CT", "Conhecimento Tecnológico", "Krita ou GIMP (imagem), Audacity (som), repositórios livres como OpenGameArt (gratuitos)."], ["CD", "Conhecimento de Design (DUA)", "Amostras sonoras acompanhadas de descrição em texto; versão visual para cada alerta sonoro; entrega como imagem, áudio ou documento (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "O trabalho de artistas e músicos locais é pouco valorizado na indústria de jogos. A turma discute autoria, licenças e remuneração. Pergunta para a roda: quem é pago, quem é creditado e quem fica invisível?"]], "seq": [["1", "Pesquisa de licenças e escolha de recursos livres", "6h"], ["2", "Produção de sprites e efeitos sonoros próprios", "16h"], ["3", "Integração ao jogo, créditos e apresentação", "8h"]], "aval": "Jogo com recursos próprios ou livres, créditos corretos e justificativa das escolhas de acessibilidade.", "mat": "Computadores com Krita, Audacity e navegador; fones de ouvido ou caixas; banco de recursos livres baixado antes.", "prep": "~2h30", "dcn": "Relaciona trabalho, cultura e tecnologia, valorizando autoria e saberes do território.", "ext": true}, {"eixo": "Informação e Comunicação", "title": "Programação de Jogos Digitais: Jogo Cooperativo", "sub": "Banco ampliado · Programação de Jogos Digitais · sugestão não validada na pesquisa", "tema": "Jogos cooperativos em equipe: divisão de papéis e versões com Git (40h).", "obj": ["Dividir tarefas em equipe (arte, código, testes, documentação).", "Usar controle de versões básico ou cópias nomeadas para trabalhar sem perder o trabalho dos colegas.", "Registrar decisões de projeto e apresentar o resultado."], "tp": [["CC", "Conhecimento do Conteúdo", "Divisão de tarefas, versionamento (Git/GitHub Desktop ou pastas versionadas), documentação, testes de jogo."], ["CP", "Conhecimento Pedagógico", "Projeto em equipe com papéis rotativos; o professor media com reuniões curtas de acompanhamento, e a turma avalia o processo e o produto."], ["CT", "Conhecimento Tecnológico", "GDevelop ou Godot (gratuitos); GitHub ou pastas compartilhadas; Trello ou quadro de papel para organizar tarefas."], ["CD", "Conhecimento de Design (DUA)", "Quadro de tarefas visível, em papel ou digital; combinados escritos; papéis escolhidos pela turma, mantendo funções claras (Engajamento e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Na indústria, o crunch e a divisão desigual de tarefas são comuns. A turma discute carga de trabalho, quem fica com as tarefas invisíveis e como dividir com justiça. Pergunta para a roda: o trabalho de cada um é igualmente reconhecido?"]], "seq": [["1", "Formação das equipes, papéis e quadro de tarefas", "6h"], ["2", "Desenvolvimento em ciclos curtos com reunião de acompanhamento", "26h"], ["3", "Teste cruzado entre equipes e apresentação com registro do processo", "8h"]], "aval": "Jogo entregue e portfólio do processo (decisões, tarefas, versões), com avaliação coletiva e individual por critérios combinados.", "mat": "Computadores com GDevelop ou Godot; acesso a pasta compartilhada ou GitHub; cartões e quadro para tarefas.", "prep": "~3h", "dcn": "Trabalho coletivo e mundo do trabalho como princípio educativo, com reflexão sobre condições e relações de trabalho.", "ext": true}, {"eixo": "Informação e Comunicação", "title": "Redes de Computadores: Conceitos e Topologias", "sub": "Banco ampliado · Redes de Computadores · sugestão não validada na pesquisa", "tema": "Como os dados circulam: modelo de camadas, endereços e topologias (30h).", "obj": ["Explicar o caminho de uma mensagem entre dois computadores.", "Reconhecer topologias e dispositivos (switch, roteador, cabo).", "Montar uma rede simples simulada e testar a comunicação."], "tp": [["CC", "Conhecimento do Conteúdo", "Modelo em camadas, endereços IP e máscara, topologias, dispositivos, teste com ping."], ["CP", "Conhecimento Pedagógico", " oduz a orientação para quem mais precisa."], ["CT", "Conhecimento Tecnológico", "Navegador e celular; sites de teste de senhas e de vazamentos (gratuitos, como exemplo, sem inserir dados reais); Canva ou papel para o guia."], ["CD", "Conhecimento de Design (DUA)", "Guia entregue em cartaz, áudio, vídeo curto ou texto; exemplos em linguagem simples; simulação de golpe feita em papel (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Golpes atingem mais quem tem pouco acesso à informação, como pessoas idosas e com baixa escolaridade digital. A turma pensa em como proteger a família e a comunidade. Pergunta para a roda: quem fica mais exposto e por quê?"]], "seq": [["1", "Levantamento de golpes reais e simulação em papel", "6h"], ["2", "Estudo de boas práticas e teste em conta fictícia", "8h"], ["3", "Produção e apresentação do guia à comunidade", "6h"]], "aval": "Guia claro e correto, adequado a um público específico, com pelo menos cinco práticas explicadas em linguagem simples.", "mat": "Celulares ou computadores; papel e canetas ou Canva; exemplos de mensagens de golpe com dados fictícios.", "prep": "~2h", "dcn": "Formação técnica ligada à cidadania, à proteção de direitos e à relação com a comunidade.", "ext": true}, {"eixo": "Informação e Comunicação", "title": "Redes de Computadores: Cabeamento e Infraestrutura da Escola", "sub": "Banco ampliado · Redes de Computadores · sugestão não validada na pesquisa", "tema": "Diagnóstico da infraestrutura de rede da escola e plano de melhoria (30h).", "obj": ["Identificar problemas de cabeamento, Wi-Fi e equipamentos na própria escola.", "Medir velocidade e cobertura com ferramentas simples.", "Propor um plano de melhoria viável, com custo estimado."], "tp": [["CC", "Conhecimento do Conteúdo", "Tipos de cabo, tomadas e conectores, pontos de acesso, medição de velocidade e sinal, orçamento básico."], ["CP", "Conhecimento Pedagógico", "Pesquisa-ação: a turma estuda um problema real da escola, gle Sheets com modelo pronto; formulário simples de entrada e saída em papel."], ["CD", "Conhecimento de Design (DUA)", "Planilha-modelo com cabeçalhos claros e cores com texto; dados reais fictícios para treinar; entrega em planilha, tabela em papel ou oral (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Desperdício de alimentos e materiais afeta a merenda e o orçamento da escola. A turma discute o impacto de perdas e como o trabalho do setor é distribuído. Pergunta para a roda: quem cuida do estoque e quem é reconhecido por isso?"]], "seq": [["1", "Visita ao almoxarifado ou cantina e coleta de dados", "6h"], ["2", "Construção da planilha de estoque e cálculos", "16h"], ["3", "Análise de perdas, proposta de melhoria e apresentação", "8h"]], "aval": "Planilha funcionando com saldo correto, análise de pelo menos um problema de estoque e proposta de ação.", "mat": "Computador com planilha (LibreOffice ou Google Sheets); modelo impresso; lista de produtos fictícia; calculadora.", "prep": "~2h30", "dcn": "Articula a técnica de gestão à realidade da escola e à responsabilidade social do trabalho.", "ext": true}, {"eixo": "Gestão e Negócios", "title": "Administração: Gestão de Pessoas e Trabalho em Equipe", "sub": "Banco ampliado · Administração · sugestão não validada na pesquisa", "tema": "Trabalho em equipe, comunicação e conflitos no ambiente de trabalho (24h).", "obj": ["Identificar papéis e comunicação em uma equipe.", "Analisar situações reais de conflito no trabalho.", "Propor combinados de equipe respeitosos e eficazes."], "tp": [["CC", "Conhecimento do Conteúdo", "Papéis em equipe, comunicação assertiva, feedback, liderança, conflitos e mediação; direitos e deveres no trabalho."], ["CP", "Conhecimento Pedagógico", "Simulação e roda de conversa: a turma encena casos de trabalho e discute, a partir de experiências reais, o que está em jogo."], ["CT", "Conhecimento Tecnológico", "Padlet ou mural de papel para registrar combinados unhos", "6h"], ["2", "Produção do cartaz com hierarquia e tipografia justificadas", "12h"], ["3", "Teste de legibilidade, ajustes e exposição", "6h"]], "aval": "Cartaz legível, com hierarquia clara e justificativa por escrito das escolhas de fonte, cor e tamanho.", "mat": "Computadores com Inkscape ou acesso ao Canva; papel, canetas; cartazes reais fotografados.", "prep": "~2h", "dcn": "Articula técnica de design e função social da comunicação visual no território.", "ext": true}, {"eixo": "Produção Cultural e Design", "title": "Design Gráfico: Cor e Identidade Visual Local", "sub": "Banco ampliado · Design Gráfico · sugestão não validada na pesquisa", "tema": "Identidade visual para um negócio, grupo cultural ou projeto do bairro (30h).", "obj": ["Entender teoria das cores e significado cultural.", "Criar logotipo e paleta para uma demanda real.", "Apresentar a identidade ao cliente e receber retorno."], "tp": [["CC", "Conhecimento do Conteúdo", "Círculo cromático, harmonias, contraste, símbolo e logotipo, aplicação em peças, manual de marca básico."], ["CP", "Conhecimento Pedagógico", "Pesquisa-ação com um cliente real do bairro: escuta, proposta, apresentação e ajustes, com devolutiva à comunidade."], ["CT", "Conhecimento Tecnológico", "Inkscape (vetor) e Canva (gratuitos); papel para esboços; Coolors ou paleta impressa como referência."], ["CD", "Conhecimento de Design (DUA)", "Paleta com cor e texto (nome ou código); exemplos em imagem com descrição; entrega em painel físico, digital ou apresentação oral (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "O design local costuma ser menos valorizado que o de grandes marcas. A turma discute remuneração justa e a valorização das referências culturais do território. Pergunta para a roda: quem pode pagar por design e quem fica de fora?"]], "seq": [["1", "Entrevista com o cliente e pesquisa de referências locais", "8h"], ["2", "Criação de logotipo, paleta e peças de aplicação", "16h"], ["3", "Apresentação ao cliente e ajustes", "6h"]], "aval": "Identidade visual coerente com a demanda, apresentada ao cliente, com justificativa das escolhas e registro do retorno recebido.", "mat": "Computadores com Inkscape ou Canva; papel, lápis de cor; exemplos de marcas locais fotografados.", "prep": "~3h", "dcn": "Diálogo entre técnica, trabalho e saberes locais, com devolutiva à comunidade.", "ext": true}, {"eixo": "Produção Cultural e Design", "title": "Design Gráfico: Ilustração e Quadrinhos Educativos", "sub": "Banco ampliado · Design Gráfico · sugestão não validada na pesquisa", "tema": "Quadrinho ou infográfico educativo sobre um tema da comunidade (30h).", "obj": ["Planejar narrativa visual em quadros e sequência.", "Produzir ilustrações coerentes com o roteiro.", "Revisar o material com um leitor real antes de publicar."], "tp": [["CC", "Conhecimento do Conteúdo", "Roteiro e storyboard, enquadramento, balões e texto, estilo de ilustração, edição e exportação."], ["CP", "Conhecimento Pedagógico", "Projeto: a turma escolhe um tema de interesse público (saúde, meio ambiente, direitos) e cria material para ser distribuído na comunidade."], ["CT", "Conhecimento Tecnológico", "Krita ou Inkscape (gratuitos); papel e caneta para o roteiro; Canva ou LibreOffice Draw para diagramação."], ["CD", "Conhecimento de Design (DUA)", "Roteiro com descrição de cada quadro (texto alternativo); material em versão impressa, digital e em áudio; entrega em quadrinho, infográfico ou apresentação (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "O acesso à informação de interesse público é desigual. A turma pensa em linguagem e formatos que cheguem a quem tem pouca escolaridade ou pouco acesso à internet. Pergunta para a roda: quem precisa dessa informação e como ela chega até essa pessoa?"]], "seq": [["1", "Escolha do tema, pesquisa e roteiro", "8h"], ["2", "Produção das ilustrações e diagramação", "16h"], ["3", "Revisão com leitor real e exposição", "6h"]], "aval": "Material finalizado, adequado ao público, com texto alternativo e registro do retorno de um leitor real.", "mat": "Computadores com Krita ou Inkscape; papel, canetas; materiais de pesquisa sobre o tema.", "prep": "~3h", "dcn": "Integra trabalho técnico, cultura e função social da comunicação.", "ext": true}, {"eixo": "Produção Cultural e Design", "title": "Design de Calçados: Pesquisa de Tendências e Moodboard", "sub": "Banco ampliado · Design de Calçados · sugestão não validada na pesquisa", "tema": "Pesquisa de referências e moodboard para uma coleção local (24h).", "obj": ["Pesquisar referências culturais, de materiais e de mercado.", "Organizar um moodboard com intenção declarada.", "Traduzir o moodboard em diretrizes de projeto."], "tp": [["CC", "Conhecimento do Conteúdo", "Pesquisa de tendências, referências culturais, paletas, materiais e texturas; briefing de coleção."], ["CP", "Conhecimento Pedagógico", "Problematização: a turma investiga o que o polo calçadista local produz, quem calça o produto e que referências valorizam o território."], ["CT", "Conhecimento Tecnológico", "Canva ou Miro (gratuitos) para moodboard; papel, revistas e amostras para colagem física; celular para fotografar referências."], ["CD", "Conhecimento de Design (DUA)", "Moodboard físico e digital; amostras táteis de materiais; descrição em texto de cada referência; entrega em painel, digital ou oral (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "A moda dita tendências de fora, e referências locais são pouco valorizadas. A turma discute identidade territorial e quem define o que é bonito. Pergunta para a roda: de quem são as referências que viram tendência?"]], "seq": [["1", "Pesquisa em campo ou com artesãos e coleta de referências", "8h"], ["2", "Montagem do moodboard e do briefing da coleção", "12h"], ["3", "Apresentação e discussão das diretrizes de projeto", "4h"]], "aval": "Moodboard coerente, com briefing escrito e justificativa das escolhas de cor, material e referência cultural.", "mat": "Computadores ou celulares; revistas, tesoura, cola; amostras de materiais; internet ou imagens baixadas antes.", "prep": "~2h", "dcn": "Valoriza o saber do território, relacionando trabalho, cultura e tecnologia.", "ext": true}, {"eixo": "Produção Cultural e Design", "title": "Design de Calçados: Materiais, Sustentabilidade e Reaproveitamento", "sub": "Banco ampliado · Design de Calçados · sugestão não validada na pesquisa", "tema": "Materiais sustentáveis e reaproveitamento de resíduos do polo calçadista (30h).", "obj": ["Conhecer materiais convencionais e alternativos usados em calçados.", "Identificar resíduos gerados e possibilidades de reaproveitamento.", "Desenvolver e testar uma proposta de produto com material reaproveitado."], "tp": [["CC", "Conhecimento do Conteúdo", "Materiais (couro, sintéticos, borracha, tecidos), ciclo de vida, resíduos do processo, reaproveitamento e custo."], ["CP", "Conhecimento Pedagógico", "Pesquisa-ação: a turma levanta resíduos de uma oficina ou fábrica local e propõe uso, dialogando com quem produz."], ["CT", "Conhecimento Tecnológico", "Celular para fotos e medições; planilha para custo; Inkscape para esboços; amostras físicas de material."], ["CD", "Conhecimento de Design (DUA)", "Amostras físicas para toque e visualização; relatório em texto, planilha ou apresentação; instruções em passos curtos (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "O polo calçadista gera trabalho e renda, mas também resíduos e trabalho informal. A turma discute condições de trabalho, saúde e impacto no território. Pergunta para a roda: quem ganha com a produção e quem arca com os resíduos?"]], "seq": [["1", "Visita ou entrevista e levantamento dos resíduos", "8h"], ["2", "Teste e protótipo de um item com material reaproveitado", "16h"], ["3", "Avaliação de custo e impacto e apresentação", "6h"]], "aval": "Protótipo ou proposta de reaproveitamento com custo estimado e análise de impacto ambiental e social.", "mat": "Amostras de resíduos (com segurança), tesoura, cola, planilha, celular; equipamentos de proteção quando necessário.", "prep": "~3h", "dcn": "Trabalho como princípio educativo e relação entre produção, ambiente e território.", "ext": true}, {"eixo": "Produção Cultural e Design", "title": "Design de Calçados: Ficha Técnica e Custo", "sub": "Banco ampliado · Design de Calçados · sugestão não validada na pesquisa", "tema": "Ficha técnica, consumo de material e custo de um calçado (24h).", "obj": ["Elaborar uma ficha técnica com componentes e medidas.", "Calcular consumo de material e custo por par.", "Comparar alternativas de material e propor uma versão mais econômica."], "tp": [["CC", "Conhecimento do Conteúdo", "Ficha técnica, lista de componentes, consumo de material, aproveitamento de corte, custo unitário e margem."], ["CP", "Conhecimento Pedagógico", "Estudo de caso de um modelo real do polo local; a turma levanta dados, calcula e discute decisões de projeto com base no custo."], ["CT", "Conhecimento Tecnológico", "LibreOffice Calc ou Google Sheets com modelo; régua e paquímetro; papel milimetrado."], ["CD", "Conhecimento de Design (DUA)", "Planilha-modelo com cabeçalhos claros; exemplo resolvido em texto e vídeo curto com legenda; entrega em planilha, ficha impressa ou oral (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Margens apertadas empurram quem produz para a informalidade e a produção em domicílio. A turma discute remuneração por peça e divisão do trabalho (planejar e executar). Pergunta para a roda: quem define o custo e quem arca com ele?"]], "seq": [["1", "Análise de um modelo real e levantamento de componentes", "6h"], ["2", "Ficha técnica, consumo e custo na planilha", "14h"], ["3", "Comparação de alternativas e apresentação", "4h"]], "aval": "Ficha técnica completa, custo calculado e uma alternativa mais econômica justificada.", "mat":  áudio e fotos; documento de texto; papel; Canva para material de apoio."], ["CD", "Conhecimento de Design (DUA)", "Roteiro de fala em texto e áudio; visita simulada com opções de papel (guia, visitante, observador); entrega oral, escrita ou gravada (Engajamento e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Os saberes locais e quem os guarda nem sempre aparecem no turismo, e o trabalho de guias é muitas vezes informal. A turma discute valorização, remuneração e quem conta a história do lugar. Pergunta para a roda: quem conta o patrimônio e quem é lembrado?"]], "seq": [["1", "Pesquisa e entrevista com mestres ou moradores", "8h"], ["2", "Elaboração do roteiro de fala e ensaio", "10h"], ["3", "Visita simulada, devolutiva e síntese", "6h"]], "aval": "Roteiro correto e envolvente, com visita simulada que considere pelo menos uma necessidade de acessibilidade.", "mat": "Celulares, cadernos, papel; local de visita ou fotos; ficha de avaliação da visita.", "prep": "~2h", "dcn": "Articula cultura, trabalho e território, com respeito ao saber local.", "ext": true}, {"eixo": "Turismo, Hospitalidade e Lazer", "title": "Turismo: Agenciamento, Custos e Pacotes", "sub": "Banco ampliado · Turismo · sugestão não validada na pesquisa", "tema": "Montagem e precificação de um pacote turístico local (30h).", "obj": ["Montar um pacote com transporte, hospedagem e atividades.", "Calcular custos, margem e preço por pessoa.", "Elaborar material de divulgação acessível."], "tp": [["CC", "Conhecimento do Conteúdo", "Componentes de um pacote, orçamento, margem, preço por pessoa, contrato e informações ao cliente, direitos do consumidor."], ["CP", "Conhecimento Pedagógico", "Estudo de caso e projeto: a turma monta um pacote real do município, calcula e discute o que cabe no bolso de diferentes públicos."], ["CT", "Conhecimento Tecnológico", "LibreOffice Calc ou Google Sheets; Canva para o material de divulgação; mapas gratuitos."], ["CD", "Conhecimento de Design (DUA)", "Planilha-modelo com cabeçalhos claros; material de divulgação com texto e imagem juntos; entrega em pacote, planilha ou apresentação (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Muitos moradores nunca viajaram a turismo no próprio estado por causa do custo. A turma discute turismo social e acesso ao lazer. Pergunta para a roda: quem pode viajar e quem trabalha para que outros viajem?"]], "seq": [["1", "Pesquisa de fornecedores e montagem do pacote", "8h"], ["2", "Cálculo de custos e preço na planilha", "14h"], ["3", "Material de divulgação e apresentação", "8h"]], "aval": "Pacote coerente, com custos e preço calculados corretamente e material de divulgação com informações claras e acessíveis.", "mat": "Computadores com planilha e Canva; lista de preços locais; mapas; calculadora.", "prep": "~2h30", "dcn": "Integra técnica, economia local e direito ao lazer.", "ext": true}, {"eixo": "Turismo, Hospitalidade e Lazer", "title": "Eventos: Planejamento e Cronograma", "sub": "Banco ampliado · Eventos · sugestão não validada na pesquisa", "tema": "Planejamento de um evento escolar do início ao fim (30h).", "obj": ["Definir objetivo, público e formato do evento.", "Elaborar cronograma, lista de tarefas e orçamento.", "Executar e avaliar o evento."], "tp": [["CC", "Conhecimento do Conteúdo", "Objetivo e público, briefing, cronograma, checklist, orçamento, equipe e avaliação pós-evento."], ["CP", "Conhecimento Pedagógico", "Projeto prático: a turma organiza um evento real da escola (mostra, feira, sarau), com papéis rotativos e avaliação coletiva."], ["CT", "Conhecimento Tecnológico", "Trello ou quadro de papel; planilha para orçamento; Canva para o convite; calendário compartilhado."], ["CD", "Conhecimento de Design (DUA)", "Quadro de tarefas visível e em papel; cronograma em texto e imagem; papéis escolhidos com funções claras (Engajamento e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "O trabalho em eventos é intenso e pouco reconhecido, e muitas tarefas são feitas por mulheres e jovens sem registro. A turma discute divisão de tarefas e carga de trabalho. Pergunta para a roda: quem trabalha nos bastidores e quem aparece no palco?"]], "seq": [["1", "Definição do evento, equipe e cronograma", "8h"], ["2", "Preparação das tarefas, orçamento e divulgação", "14h"], ["3", "Realização do evento e avaliação", "8h"]], "aval": "Evento realizado, com cronograma cumprido e relatório de avaliação com pontos fortes e pontos a melhorar.", "mat": "Espaço da escola; quadro de tarefas, papel, impressora; computador ou celular para convite e planilha.", "prep": "~3h", "dcn": "Trabalho coletivo e relação com a comunidade como princípio educativo.", "ext": true}, {"eixo": "Turismo, Hospitalidade e Lazer", "title": "Eventos: Acessibilidade e Inclusão em Eventos", "sub": "Banco ampliado · Eventos · sugestão não validada na pesquisa", "tema": "Como planejar um evento acessível (24h).", "obj": ["Reconhecer barreiras físicas, comunicacionais e atitudinais em eventos.", "Aplicar um checklist de acessibilidade a um local e a um evento.", "Propor melhorias para um evento da escola."], "tp": [["CC", "Conhecimento do Conteúdo", "Acessibilidade física, comunicacional e atitudinal; checklist de acessibilidade; Libras, legendas, audiodescrição; comunicação clara."], ["CP", "Conhecimento Pedagógico", "Vivência e análise: a turma visita um espaço, aplica o checklist e dialoga com pessoas com deficiência sobre suas experiências."], ["CT", "Conhecimento Tecnológico", "Checklist impresso; celular para fotos e registro; Canva para convite acessível."], ["CD", "Conhecimento de Design (DUA)", "Checklist em texto e imagem; relatório em texto, áudio ou apresentação; vivência com apoio e escolha de participação (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Muitos eventos excluem quem tem deficiência por barreiras que poderiam ser evitadas, e o custo da acessibilidade costuma ser empurrado para o fim. A turma discute direito de participação. Pergunta para a roda: o evento é pensado para quem?"]], "seq": [["1", "Estudo das barreiras e do checklist", "6h"], ["2", "Visita ao espaço e aplicação do checklist", "10h"], ["3", "Relatório, propostas e apresentação", "8h"]], "aval": "Checklist aplicado com registro dos problemas e proposta de melhoria viável, apresentada à turma ou à gestão.", "mat": "Checklist impresso, celulares, trena; convite do evento como material de análise.", "prep": "~2h", "dcn": "Formação para o respeito à diversidade e ao direito de participação, ligada ao trabalho técnico.", "ext": true}, {"eixo": "Turismo, Hospitalidade e Lazer", "title": "Eventos: Cerimonial, Comunicação e Sustentabilidade", "sub": "Banco ampliado · Eventos · sugestão não validada na pesquisa", "tema": "Cerimonial, comunicação com o público e eventos de menor impacto ambiental (24h).", "obj": ["Conhecer rotinas básicas de cerimonial e protocolo.", "Planejar a comunicação do evento (convite, programação, sinalização).", "Aplicar medidas para reduzir resíduos e consumo."], "tp": [["CC", "Conhecimento do Conteúdo", "Cerimonial e protocolo (noções), comunicação do evento, sinalização, resíduos e consumo, reaproveitamento de materiais."], ["CP", "Conhecimento Pedagógico", "Estudo de caso e prática: a turma analisa um evento real da escola, identifica gargalos e desperdícios e propõe melhorias."], ["CT", "Conhecimento Tecnológico", "Canva ou papel para sinalização; planilha de resíduos; celular para registro."], ["CD", "Conhecimento de Design (DUA)", "Sinalização com texto e ícones; programação em texto e áudio; entrega em plano, cartaz ou apresentação (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Eventos geram muito resíduo, e o custo de materiais pesa nas escolas. A turma discute reaproveitamento e valor do trabalho de quem organiza. Pergunta para a roda: quem arca com o custo do evento e quem lucra?"]], "seq": [["1", "Análise de um evento real e levantamento de resíduos", "6h"], ["2", "Plano de comunicação e de redução de resíduos", "12h"], ["3", "Apresentação e devolutiva", "6h"]], "aval": "Plano de comunicação e sustentabilidade coerente, com pelo menos três medidas concretas e viáveis.", "mat": "Canva ou papel; planilha; fotos de evento anterior; materiais reaproveitáveis.", "prep": "~2h", "dcn": "Relaciona trabalho, ambiente e responsabilidade social na formação técnica.", "ext": true}, {"eixo": "Turismo, Hospitalidade e Lazer", "title": "Hospedagem: Recepção e Atendimento ao Hóspede", "sub": "Banco ampliado · Hospedagem · sugestão não validada na pesquisa", "tema": "Rotinas de recepção, atendimento e resolução de situações com hóspedes (24h).", "obj": ["Realizar check-in e check-out em simulação.", "Praticar comunicação clara e acolhedora, inclusive com hóspedes com deficiência.", "Registrar e resolver ocorrências."], "tp": [["CC", "Conhecimento do Conteúdo", "Reservas, check-in e check-out, registro de hóspedes, comunicação com o cliente, ocorrências e reclamações, LGPD (noções)."], ["CP", "Conhecimento Pedagógico", "Simulação de situações com papéis de recepcionista, hóspede e observador, seguida de análise coletiva."], ["CT", "Conhecimento Tecnológico", "Planilha como livro de registro; modelos impressos de ficha; celular para gravar simulações (com consentimento)."], ["CD", "Conhecimento de Design (DUA)", "Roteiros em texto e áudio; simulação com papéis variados; entrega oral, escrita ou gravada (Engajamento e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Trabalhadores da hospedagem enfrentam jornadas longas, sazonalidade e baixos salários. A turma discute quem atende e quem é bem atendido, com recortes de classe e de gênero. Pergunta para a roda: quem recebe e quem cuida dos bastidores?"]], "seq": [["1", "Estudo de rotinas e fichas", "6h"], ["2", "Simulações com observação e devolutiva", "12h"], ["3", "Revisão do atendimento e avaliação coletiva", "6h"]], "aval": "Atendimento simulado completo e cordial, com registro correto e resposta adequada a uma situação de reclamação.", "mat": "Fichas impressas, planilha, cartões de casos; celular; ambiente de recepção simulado.", "prep": "~2h", "dcn": "Trabalho como princípio educativo, com análise das condições do trabalho no setor.", "ext": true}, {"eixo": "Turismo, Hospitalidade e Lazer", "title": "Hospedagem: Governança e Rotinas de Arrumação", "sub": "Banco ampliado · Hospedagem · sugestão não validada na pesquisa", "tema": "Governança hoteleira: limpeza, organização e segurança dos quartos (24h).", "obj": ["Planejar e executar a arrumação de um quarto seguindo padrões.", "Aplicar ergonomia e segurança no trabalho.", "Registrar achados e perdidos e ocorrências."], "tp": [["CC", "Conhecimento do Conteúdo", "Rotina de arrumação, enxoval, produtos de limpeza e segurança, ergonomia, controle de achados e perdidos."], ["CP", "Conhecimento Pedagógico", "Prática orientada e análise do trabalho: a turma executa a rotina, observa esforço físico e propõe melhorias, valorizando o saber de quem faz."], ["CT", "Conhecimento Tecnológico", "Checklist impresso; celular para registro; planilha de controle; cronômetro para medir tempo de tarefa."], ["CD", "Conhecimento de Design (DUA)", "Passo a passo com foto e texto; demonstração por vídeo curto com legenda; tarefa dividida em etapas curtas e escolha de função (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "O trabalho de camareiras é pesado, pouco valorizado e majoritariamente feminino. A turma discute dualidade entre quem gerencia e quem executa, saúde no trabalho e remuneração. Pergunta para a roda: quem mantém o hotel funcionando e quem é reconhecido por isso?"]], "seq": [["1", "Estudo da rotina e do checklist, com demonstração", "6h"], ["2", "Prática de arrumação com cronometragem e observação", "12h"], ["3", "Análise de ergonomia, propostas de melhoria e apresentação", "6h"]], "aval": "Quarto arrumado conforme o checklist, com registro de pontos de esforço e uma proposta de melhoria para o trabalho.", "mat": "Sala-laboratório ou espaço simulado; enxoval, material de limpeza seguro, checklist, cronômetro.", "prep": "~2h", "dcn": "Valoriza o trabalho e a saúde de quem executa, com leitura crítica da divisão do trabalho.", "ext": true}, {"eixo": "Turismo, Hospitalidade e Lazer", "title": "Hospedagem: Hospitalidade Digital e Reservas", "sub": "Banco ampliado · Hospedagem · sugestão não validada na pesquisa", "tema": "Reservas online, comunicação digital e avaliação de hóspedes (30h).", "obj": ["Compreender como funcionam as reservas por plataformas.", "Planejar a divulgação de uma pousada ou hospedagem local.", "Analisar avaliações e propor respostas respeitosas."], "tp": [["CC", "Conhecimento do Conteúdo", "Canais de reserva, taxas e comissões, fotos e descrição de acomodação, avaliações de hóspedes, atendimento digital."], ["CP", "Conhecimento Pedagógico", "Estudo de caso de uma hospedagem local; a turma compara plataformas, discute taxas e propõe a divulgação."], ["CT", "Conhecimento Tecnológico", "Canva; planilha para comparar taxas; celular para fotos; mapas gratuitos."], ["CD", "Conhecimento de Design (DUA)", "Descrições em texto e imagem juntos; modelo de resposta a avaliação; entrega em texto, apresentação ou material de divulgação (Representação e Ação/Expressão, Roteiro DUA)."], ["CS", "Contexto Sociopolítico", "Pequenas pousadas dependem de plataformas que cobram altas comissões e controlam a visibilidade. A turma discute dependência de plataformas e alternativas locais. Pergunta para a roda: quem fica com a maior parte do valor da diária?"]], "seq": [["1", "Análise de plataformas e de um caso local", "8h"], ["2", "Produção de descrição, fotos e plano de divulgação", "16h"], ["3", "Simulação de respostas a avaliações e apresentação", "6h"]], "aval": "Divulgação clara e acessível, com comparação de taxas e respostas respeitosas a avaliações.", "mat": "Computadores ou celulares; Canva; planilha; exemplos de anúncios e avaliações (com dados fictícios).", "prep": "~2h30", "dcn": "Relaciona tecnologia, trabalho e economia local, com leitura crítica das plataformas.", "ext": true}], "res": [{"g": 1, "l": "G", "n": "Google Classroom / Moodle", "d": "Plataforma de Gestão de Aprendizagem — organização de turmas, materiais e atividades. Citada por 7 de 12 docentes (categoria plataformas de gestão).", "a": [["Acessar", "https://classroom.google.com/", "ext"], ["Tutorial", "https://support.google.com/edu/classroom/", "ext"], ["Vídeo (3:55)", "https://www.youtube.com/watch?v=8LssYh_u7RY", "ext"]], "x": ["Gestão e Negócios", "Transversais"], "ac": "Títulos descritivos, arquivos em formato acessível, legenda nos vídeos e cópia para baixar ou imprimir."}, {"g": 1, "l": "P", "n": "PowerPoint", "d": "Ferramenta de autoria e apresentação para conteúdo expositivo e ilustração técnica. Autoria foi a categoria mais marcada no diagnóstico (10 de 12 docentes).", "a": [["Acessar", "https://www.microsoft.com/microsoft-365/powerpoint", "ext"], ["Tutorial", "https://support.microsoft.com/powerpoint", "ext"], ["Vídeo (9:58)", "https://www.youtube.com/watch?v=78qY_EZGjM4", "ext"]], "x": ["Gestão e Negócios", "Transversais"], "ac": "Use o Verificador de Acessibilidade do programa, texto alternativo, ordem de leitura correta e poucas animações."}, {"g": 1, "l": "P", "n": "Prezi", "d": "Apresentações dinâmicas e não lineares, como alternativa visual ao formato tradicional de slides.", "a": [["Acessar", "https://prezi.com/", "ext"], ["Tutorial", "tutorial-prezi", "int"], ["Vídeo (11:27)", "https://www.youtube.com/watch?v=ljN03s3PD8c", "ext"]], "x": ["Transversais"], "ac": "O zoom e o movimento podem causar desconforto e dificultar a leitura. Ofereça versão linear (PDF ou slides), texto grande e alto contraste; evite transições longas."}, {"g": 1, "l": "C", "n": "Canva", "d": "Criação de identidade visual, cartazes e apresentações de forma acessível.", "a": [["Acessar", "https://www.canva.com/", "ext"], ["Tutorial", "https://www.canva.com/help/", "ext"], ["Vídeo (14:27)", "https://www.youtube.com/watch?v=5ybtGN16uOQ", "ext"]], "x": ["Gestão e Negócios", "Turismo, Hospitalidade e Lazer", "Produção Cultural e Design", "Transversais"], "ac": "Editor visual difícil com leitor de tela ou só teclado. Use modelo pronto, texto alternativo, fontes legíveis e exportação em PDF; aceite entrega oral ou impressa."}, {"g": 1, "l": "M", "n": "Miro", "d": "Quadro branco colaborativo para mapas mentais e fluxogramas de processo.", "a": [["Acessar", "https://miro.com/", "ext"], ["Tutorial", "https://help.miro.com/hc/en-us", "ext"], ["Vídeo (1:57)", "https://www.youtube.com/watch?v=OIRFUfBBcgY", "ext"]], "x": ["Gestão e Negócios"], "ac": "Quadro espacial e livre é difícil para baixa visão e leitor de tela. Entregue também o mapa em lista ou texto numerado; use zoom e contraste."}, {"g": 2, "l": "M", "n": "Mentimeter", "d": "Avaliação formativa em tempo real: enquetes, quizzes e nuvens de palavras.", "a": [["Acessar", "https://www.mentimeter.com/", "ext"], ["Tutorial", "https://help.mentimeter.com/en/", "ext"], ["Vídeo (15:20)", "https://www.youtube.com/watch?v=--6zO2iRGSQ", "ext"]], "x": ["Gestão e Negócios", "Produção Cultural e Design"], "ac": "Respostas em tempo real e tempo limitado geram pressão. Permita resposta anônima ou no papel, aviso prévio e tempo flexível; confira o contraste."}, {"g": 2, "l": "P", "n": "Padlet", "d": "Mural colaborativo para curadoria de conteúdo e síntese visual da turma.", "a": [["Acessar", "https://padlet.com/", "ext"], ["Tutorial", "https://padlet.help/l/en", "ext"], ["Vídeo (5:36)", "https://www.youtube.com/watch?v=HQDvj3tYbQE", "ext"]], "x": ["Gestão e Negócios", "Turismo, Hospitalidade e Lazer"], "ac": "Mural livre confunde leitor de tela e pode expor autores. Prefira o formato em colunas ou lista, texto alternativo nas imagens e opção sem identificação."}, {"g": 2, "l": "K", "n": "Kahoot!", "d": "Gamificação e avaliação formativa em formato de quiz competitivo.", "a": [["Acessar", "https://kahoot.com/", "ext"], ["Tutorial", "https://support.kahoot.com/hc/en-us", "ext"], ["Vídeo (5:47)", "https://www.youtube.com/watch?v=VnNWt6fZFFw", "ext"]], "x": ["Transversais"], "ac": "Tempo limitado, sons altos e ranking público. Ajuste o tempo, desative a música, evite ranking que exponha estudantes e tenha uma versão impressa do quiz."}, {"g": 2, "l": "G", "n": "GeoGebra", "d": "Simulador matemático/geométrico gratuito, útil para eixos técnicos e exatas.", "a": [["Acessar", "https://www.geogebra.org/", "ext"], ["Tutorial", "https://help.geogebra.org/hc/en-us", "ext"], ["Vídeo (3:48)", "https://www.youtube.com/watch?v=qVCMMINhuxM", "ext"]], "x": ["Transversais"], "ac": "Construções visuais e arrastar com mouse. Forneça descrição textual da construção, use teclado quando possível e aceite entrega em tabela ou oral."}, {"g": 2, "l": "T", "n": "Tinkercad", "d": "Modelagem 3D e simulação de circuitos/eletrônica, gratuito e no navegador.", "a": [["Acessar", "https://www.tinkercad.com/", "ext"], ["Tutorial", "https://www.tinkercad.com/help", "ext"], ["Vídeo (8:40)", "https://www.youtube.com/watch?v=K_clAFq7jjs", "ext"]], "x": ["Produção Cultural e Design", "Informação e Comunicação"], "ac": "Modelagem 3D e circuitos dependem do mouse e da visão. Descreva o circuito ou modelo em texto, trabalhe em dupla e aceite entrega física ou oral."}, {"g": 2, "l": "G", "n": "Gamma", "d": "Criação de apresentações, documentos e páginas web com apoio de inteligência artificial.", "a": [["Acessar", "https://gamma.app/", "ext"], ["Tutorial", "tutorial-gamma", "int"], ["Vídeo (8:39)", "https://www.youtube.com/watch?v=gCaaTjJu57g", "ext"]], "x": ["Transversais"], "ac": "Conteúdo gerado por IA pode vir sem texto alternativo e com contraste variável. Revise cada slide (texto alternativo, contraste, ordem de leitura) e confira as informações geradas."}, {"g": 3, "l": "P", "n": "Photoshop", "d": "Edição e tratamento de imagens. Citado pelos docentes no diagnóstico.", "a": [["Acessar", "https://www.adobe.com/br/products/photoshop.html", "ext"], ["Tutorial", "https://www.adobe.com/br/learn/photoshop/in-app/introduction-to-the-workspace", "ext"], ["Vídeo (5:00)", "https://www.youtube.com/watch?v=FoviF4qDYRY", "ext"]], "x": ["Produção Cultural e Design"], "ac": "Interface densa e dependente do mouse; exige máquina potente. Use atalhos de teclado, tutorial em passos curtos e alternativa gratuita (ex.: GIMP) para quem não tem licença."}, {"g": 3, "l": "C", "n": "CorelDRAW", "d": "Ilustração vetorial e diagramação. Citado pelos docentes no diagnóstico.", "a": [["Acessar", "https://www.coreldraw.com/br/", "ext"], ["Tutorial", "https://learn.corel.com/", "ext"], ["Vídeo (8:22)", "https://www.youtube.com/watch?v=QwGUyl8MQAU", "ext"]], "x": ["Produção Cultural e Design"], "ac": "Mesma limitação visual e de mouse, e licença paga. Inkscape é alternativa de software livre; ofereça roteiro passo a passo em texto."}, {"g": 3, "l": "U", "n": "Unity", "d": "Motor para criação de jogos e simulações 2D/3D. Citado pelos docentes no diagnóstico.", "a": [["Acessar", "https://unity.com/", "ext"], ["Tutorial", "https://learn.unity.com/", "ext"], ["Vídeo (21:27)", "https://www.youtube.com/watch?v=MkZSeMBl91U", "ext"]], "x": ["Informação e Comunicação"], "ac": "Interface visual complexa, pesada e pouco amigável a leitor de tela. Godot é alternativa para máquinas limitadas; ofereça roteiros offline e comentários que descrevam cada bloco de código."}, {"g": 3, "l": "V", "n": "Visual Studio Code", "d": "Editor de código gratuito e extensível. Citado pelos docentes no diagnóstico.", "a": [["Acessar", "https://code.visualstudio.com/", "ext"], ["Tutorial", "https://code.visualstudio.com/docs", "ext"], ["Vídeo (24:29)", "https://www.youtube.com/watch?v=CMBt88YBay4", "ext"]], "x": ["Informação e Comunicação"], "ac": "Exige configuração inicial para leitor de tela e tema. Ative o m e e da visão; descreva o modelo em texto e aceite entrega física ou oral."}, {"g": 4, "l": "I", "n": "IbisPaint", "d": "Ilustração no celular. Usado como alternativa no plano de Design Gráfico. Gratuito com recursos pagos.", "a": [["Acessar", "https://ibispaint.com/", "ext"]], "x": ["Produção Cultural e Design"], "ac": "Boa opção para quem só tem celular; ofereça alternativa para quem tem dificuldade motora fina."}, {"g": 4, "l": "S", "n": "Scratch", "d": "Programação em blocos. Usado no plano de Desenvolvimento de Sistemas. Gratuito; editor offline disponível.", "a": [["Acessar", "https://scratch.mit.edu/", "ext"]], "x": ["Informação e Comunicação"], "ac": "Comece por blocos visuais; permita zoom, contraste ampliado e tema escuro."}, {"g": 4, "l": "A", "n": "App Inventor", "d": "Aplicativos Android em blocos. Usado no plano de Desenvolvimento de Sistemas. Gratuito; exige conexão.", "a": [["Acessar", "https://appinventor.mit.edu/", "ext"]], "x": ["Informação e Comunicação"], "ac": "Blocos visuais com zoom e contraste ampliado; instruções em passos numerados."}, {"g": 4, "l": "R", "n": "Replit", "d": "Programação no navegador, para transição a Python. Usado no plano de Desenvolvimento de Sistemas. Gratuito com limites; exige conexão.", "a": [["Acessar", "https://replit.com/", "ext"]], "x": ["Informação e Comunicação"], "ac": "Exige conexão; teste o editor com NVDA antes e tenha alternativa offline (Thonny)."}, {"g": 4, "l": "T", "n": "Thonny", "d": "Editor simples de Python para iniciantes. Usado na variação avançada de Desenvolvimento de Sistemas. Livre; funciona offline.", "a": [["Acessar", "https://thonny.org/", "ext"]], "x": ["Informação e Comunicação"], "ac": "Interface simples; aumente a fonte e teste o anúncio de indentação com NVDA."}, {"g": 4, "l": "G", "n": "Godot Engine", "d": "Motor de jogos leve para máquinas com hardware limitado. Usado no plano de Programação de Jogos. Livre; funciona offline.", "a": [["Acessar", "https://godotengine.org/", "ext"]], "x , "[Auditiva] Priorizar comunicação escrita e visual nas atividades em grupo.", "[Motora] Permitir teclado, ditado por voz ou celular no lugar de mouse e escrita manual.", "[Motora] Prever tempo extra e entrega em formato alternativo (oral, digital, protótipo).", "[Intelectual] Usar linguagem simples, exemplos concretos e instruções em passos curtos.", "[Intelectual] Retomar o conteúdo em mais de um formato e conferir o entendimento durante a atividade.", "[TEA] Antecipar a rotina, avisar mudanças e dar instruções claras e diretas.", "[TEA] Considerar hipersensibilidade a som, luz e toque; oferecer espaço calmo e fones.", "[TDAH] Dividir a tarefa em etapas curtas, com checklist e metas visíveis.", "[TDAH] Permitir pausas e movimento, com prazos fracionados e retornos frequentes.", "[Dislexia] Usar fonte sem serifa, espaçamento amplo e blocos curtos; oferecer áudio do texto.", "[Dislexia] Aceitar respostas orais e dar apoio de corretor e de leitura assistida.", "[Discalculia] Permitir calculadora e modelos prontos de planilha.", "[Altas habilidades] Oferecer desafios ampliados e escolha de aprofundamento do projeto.", "[Transversal] Combinar critérios de avaliação claros e aceitar mais de um formato de entrega.", "[Transversal] Planejar com o AEE e a coordenação as adaptações antes da aula.", "[Transversal] Evitar a exposição pública de dificuldades; privilegiar feedback individual e respeitoso."], "boxes": [["[Representação] Estudo de caso e planilhas: entregue o roteiro em texto, áudio e vídeo curto com legenda, e permita ler o caso antes da aula.", "[Representação] Planilhas: use cabeçalhos claros, contraste adequado e colunas rotuladas, compatíveis com leitor de tela (NVDA); não dependa só de cor.", "[Engajamento] TEA e TDAH: divida a construção da planilha em passos curtos, com checklist visível, e avise antes de mudar de etapa.", "[Ação e Expressão] Fluxos (BPMN): ofereça também uma descrição em texto ou lista ordenada; aceite o fluxo desenhado, oral ou em tabela."], ["[Representação] Sala de aula invertida: envie o material em texto, áudio e vídeo com legenda e permita ler offline ou impresso, para quem tem pouca conexão ou dispositivo.", "[Engajamento] Letramento digital desigual: forme duplas com papéis alternados, ofereça modelo de planilha pronto e passo a passo ilustrado, e evite expor quem tem dificuldade.", "[Representação] Planilhas e infográfico: use contraste adequado, fontes legíveis e texto alternativo nas imagens; teste a planilha com leitor de tela (NVDA).", "[Engajamento] [Ação e Expressão] TEA, TDAH e dislexia: divida a tarefa em etapas curtas com checklist, antecipe a rotina da aula e aceite respostas orais ou escritas."], ["[Representação] Ficha técnica: ofereça versão numérica, em áudio narrado e impressa em fonte ampliada, com unidades e medidas escritas por extenso.", "[Representação] Cozinha: apresente o espaço, os utensílios e os riscos (calor, corte) antes da prática; para baixa visão, sinalize bancadas com contraste e boa iluminação.", "[Engajamento] TEA ou hipersensibilidade sensorial: avise sobre odores, ruídos e texturas e ofereça funções alternativas na brigada.", "[Ação e Expressão] Cálculo de custo: permita calculadora e modelo de planilha pronto (discalculia); aceite a roda de discussão oral ou escrita."], ["[Representação] Cegueira e baixa visão: use amostras táteis e descreva por extenso formas, cores e texturas dos materiais.", "[Representação] Modelagem digital: ofereça tutorial em texto e em vídeo com legenda; comece pelo vetor 2D (Inkscape) e avance em etapas curtas.", "[Ação e Expressão] Deficiência motora: permita atalhos de teclado, mouse alternativo e entrega do protótipo em formato oral ou físico.", "[Engajamento] TDAH e TEA: combine metas visíveis por etapa, pausas e a ordem das tarefas antes da entrevista com o artesão."], ["[Representação] Peças editoriais: confira o contraste (mínimo 4,5:1), o tamanho e a legibilidade da fonte e inclua texto alternativo nas imagens do catálogo.", "[Representação] Daltonismo: não use a cor como único sinal; teste a paleta com um simulador de daltonismo.", "[Representação] Dislexia: prefira fontes sem serifa, espaçamento amplo e blocos curtos de texto; ofereça o roteiro passo a passo em formato simples.", "[Ação e Expressão] Permita escolher a ferramenta (Photoshop, CorelDRAW, Canva ou alternativa gratuita) e o formato da reflexão final (oral ou escrita)."], ["[Representação] Vídeos e peças audiovisuais: use legenda, transcrição e audiodescrição; avise sobre luzes piscantes e sons altos (epilepsia fotossensível).", "[Representação] Briefing e rubrica: linguagem simples, exemplos concretos e critérios por escrito antes da produção.", "[Engajamento] Estudo de caso sobre estereótipos: avise antes sobre temas sensíveis e ofereça formas seguras de participar.", "[Ação e Expressão] Roda de discussão: aceite falas por escrito ou em duplas (TEA, ansiedade) e preveja mediação em Libras."], ["[Engajamento] Gamificação: pontue esforço e processo, não só velocidade; evite ranking público que exponha estudantes.", "[Engajamento] Desafios com metas visíveis e tempo flexível; permita pausas e novas tentativas sem penalidade (TDAH, ansiedade).", "[Representação] Canva: use texto alternativo, contraste e fontes legíveis; para baixa visão, ofereça ampliação e modo escuro quando possível.", "[Ação e Expressão] Aceite entrega visual, oral ou protótipo físico; na deficiência motora, permita celular, ditado por voz ou trabalho em dupla."], ["[Representação] Leitor de tela (NVDA): teste editores e plataformas antes; ofereça fluxogramas com audiodescrição e alternativa em texto estruturado.", "[Representação] Scratch e App Inventor: comece por blocos visuais; para baixa visão, permita zoom, contraste ampliado e tema escuro.", "[Engajamento] TEA e TDAH: instruções em passos numerados, exemplos prontos para modificar e prazos fracionados por etapa.", "[Representação] Surdez e deficiência auditiva: vídeos com legenda, mediação em
