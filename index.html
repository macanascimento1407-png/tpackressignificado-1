const tutPrezi=()=>`<div class="tut"><h2>Tutorial Prático: Como Criar Apresentações no Prezi Present</h2><p class="sub">Guia de Atualização Técnica para Produção de Recursos Pedagógicos</p>
<h3>1. O que é o Prezi Present?</h3><p>O <b>Prezi Present</b> é a evolução tecnológica da clássica plataforma de apresentações Prezi. O antigo formato (<i>Prezi Classic</i>), baseado em tecnologia Flash e tela infinita sem estrutura rígida, deixou de funcionar com o fim do Flash; apresentações antigas podem ser abertas e convertidas no Prezi Present. A nova versão opera 100% em padrões web modernos (HTML5), garantindo maior estabilidade, acessibilidade e integração visual.</p><div class="callout"><b>Diferencial Pedagógico: Estrutura em Zoom Dinâmico.</b> A grande inovação do Prezi Present está na navegação estruturada. Em vez de slides lineares e soltos, a apresentação organiza-se através de um mapa mental conceitual com Visão Geral (Overview), Tópicos e Subtópicos. O efeito de aproximação (zoom) permite detalhar conteúdos sem que o aluno perca a noção do contexto geral do tema estudado.</div>
<h3>2. Acessando e Criando uma Conta</h3><p>Para começar a criar seus recursos educacionais dinâmicos na plataforma, siga o passo a passo de acesso inicial gratuito:</p><ol><li><b>Acesse o site oficial:</b> abra o seu navegador e digite o endereço www.prezi.com. No canto superior direito, clique em Começar ou Inscrever-se.</li><li><b>Escolha a modalidade Gratuita:</b> na tela de planos, selecione a aba Básico e clique no plano Basic (Gratuito), ideal para a elaboração de materiais e projetos pedagógicos sem custos.</li><li><b>Cadastro ou Single Sign-On:</b> crie sua conta preenchendo nome, e-mail e senha, ou facilite o acesso efetuando login direto via conta Google ou Microsoft institucional.</li></ol>
<h3>3. Criando uma Nova Apresentação</h3><p>Com o painel do Prezi Present aberto, a criação de novas apresentações é intuitiva e ágil:</p><ul><li><b>Acesso ao Painel Central:</b> no menu esquerdo, clique no ícone do Prezi Present para visualizar todos os seus projetos.</li><li><b>Uso de Modelos Prontos:</b> clique na opção Criar a partir de modelo. A plataforma oferece dezenas de cenários organizados por categorias como Educação, Treinamento e Estratégia.</li><li><b>Definição de Título e Privacidade:</b> digite o nome da apresentação (ex: Plano de Aula - SFAP) e selecione a opção "Qualquer pessoa na web" para permitir o compartilhamento público gratuito com os estudantes.</li></ul><div class="callout"><b>Dica de Design Pedagógico.</b> Ao escolher um modelo, prefira layouts com esquemas de cores limpos e de alto contraste. Estruturas visuais com fundo neutro facilitam a leitura em projetores e telas de computadores ou dispositivos móveis.</div>
<h3>4. Interface e Navegação por Zoom</h3><p>A área de trabalho do Prezi Present divide-se em três partes fundamentais para o desenvolvimento do seu recurso educacional:</p><ul><li><b>Painel Esquerdo (Painel de Estrutura):</b> exibe a linha do tempo e a hierarquia visual completa. Mostra a Visão Geral (Overview) no topo e a lista sequencial de Tópicos e Subtópicos.</li><li><b>Área de Trabalho (Canvas Central):</b> espaço interativo onde você clica para editar textos, mover elementos e visualizar o comportamento do zoom em tempo real.</li><li><b>Barra Superior (Ferramentas):</b> contém os botões principais de edição: Inserir (mídias), Estilo (cores e fontes) e o botão Apresentar.</li><li><b>Controle de Zoom (Profundidade):</b> basta dar duplo clique em qualquer tópico na tela para "entrar" nele e detalhar o conteúdo específico.</li></ul>
<h3>5. Estrutura de Tópicos e Subtópicos (Planetas e Cartões)</h3><p>O Prezi Present utiliza duas formas de organização interna para construir a sequência do seu conteúdo:</p><table><caption class="sr">Tipos de tópico no Prezi Present</caption><tr><th scope="col">Tipo de Tópico</th><th scope="col">Estrutura Visual</th><th scope="col">Aplicação Pedagógica</th></tr><tr><td>Tópico Planeta</td><td>Círculos/ícones ao redor do tema central com conectores visuais.</td><td>Ideal para módulos ou unidades de ensino que contêm vários subtópicos internos.</td></tr><tr><td>Tópico Cartão</td><td>Página retangular com leitura linear tradicional.</td><td>Perfeito para textos mais extensos, resumos, citações ou definições diretas.</td></tr><tr><td>Subtópicos</td><td>Níveis internos dentro de cada planeta/cartão.</td><td>Utilizado para detalhar exemplos, exercícios resolvidos ou aprofundamentos.</td></tr></table>
<h3>6. Inserção de Recursos e Mídias</h3><p>Para enriquecer o material e aumentar o engajamento dos estudantes, acesse o menu Inserir no topo da tela:</p><ul><li><b>Textos e Fontes:</b> clique e digite diretamente. A barra de texto permite alterar tamanhos, alinhamentos e cores de forma similar a editores tradicionais.</li><li><b>Imagens e Ícones:</b> escolha arquivos do seu computador ou utilize a biblioteca integrada com milhares de ícones e fotos de uso livre.</li><li><b>Vídeos do YouTube:</b> clique em Inserir &gt; Vídeo, cole a URL do vídeo do YouTube e clique em Inserir. O vídeo será executado direto na apresentação.</li></ul>
<h3>7. Compartilhando e Apresentando</h3><p>Com a apresentação finalizada, você pode executá-la ou compartilhá-la em ambientes virtuais:</p><ol><li><b>Executar:</b> clique no botão Apresentar no canto superior direito para entrar no modo tela cheia. Utilize as setas do teclado para navegar.</li><li><b>Link de Visualização:</b> clique no ícone de compartilhamento e selecione Criar novo link. Insira um nome (ex: Alunos SFAP) e copie o link gerado.</li><li><b>Integração com AVA:</b> cole o link diretamente no Moodle, Google Classroom ou no documento final do seu Produto Educacional para acesso imediato.</li></ol>
<div class="act"><button class="btn ghost" data-go="recursos">← Voltar aos recursos</button></div></div>`;
const tutGamma=()=>`<div class="tut"><h2>Tutorial Prático: Gamma App</h2><p class="sub">Guia passo a passo para criar apresentações, documentos e páginas web profissionais utilizando Inteligência Artificial (IA).</p>
<h3>1. O que é o Gamma App?</h3><p>O <b>Gamma App</b> é uma ferramenta inovadora de IA generativa que permite a criação rápida de apresentações, documentos e páginas da web (sites) sem a necessidade de formatação manual complexa. Ele estrutura conteúdos, gera imagens e aplica designs responsivos automaticamente a partir de um simples comando de texto.</p><div class="callout"><b>Objetivo deste tutorial.</b> Capacitar educadores, estudantes e profissionais a utilizarem a ferramenta desde o cadastro até a exportação final para PowerPoint e PDF.</div>
<h3>2. Criando sua Conta Gratuita</h3><p>O acesso ao Gamma é feito diretamente pelo navegador web, sem necessidade de instalação pesada:</p><ul><li><b>Passo 1:</b> acesse o site oficial em gamma.app.</li><li><b>Passo 2:</b> clique no botão de cadastro (geralmente rotulado como "Sign up" ou "Criar com o Google").</li><li><b>Passo 3:</b> utilize sua conta do Google ou cadastre um e-mail corporativo/pessoal.</li><li><b>Passo 4:</b> responda brevemente ao questionário de uso (selecione "Educação", "Trabalho" ou "Uso pessoal") para definir seu perfil e receber créditos iniciais gratuitos de IA.</li></ul><div class="callout"><b>Dica de Créditos.</b> Contas gratuitas recebem créditos iniciais para gerar conteúdos. Convidar amigos ou colegas pela aba de indicações adiciona créditos bônus à sua conta.</div>
<h3>3. Gerando Apresentações e Documentos com IA</h3><p>Após acessar o painel principal, a criação automatizada ocorre de forma muito intuitiva:</p><ul><li><b>Passo 1:</b> clique em "Criar novo" (Create new) na tela inicial.</li><li><b>Passo 2:</b> escolha entre as opções: Apresentação (slides), Documento (relatórios/artigos) ou Página web.</li><li><b>Passo 3:</b> selecione a opção "Gerar com IA" (Generate).</li><li><b>Passo 4:</b> digite um prompt descritivo detalhado sobre o tema desejado (ex: "Apresentação de 5 slides sobre gamificação na educação matemática"). Quanto mais específico o texto, melhor será o resultado da IA.</li><li><b>Passo 5:</b> escolha o tom da voz, o público-alvo e o estilo visual/paleta de cores sugeridos pela ferramenta, depois clique em Gerar.</li></ul>
<h3>4. Editando Layouts e Conteúdos</h3><p>Assim que o Gamma gera a estrutura, você pode refiná-la por completo:</p><ul><li><b>Blocos Visuais:</b> adicione imagens, cartões, colunas, gráficos ou vídeos utilizando a barra lateral de ferramentas (à direita).</li><li><b>Edição de Texto:</b> clique em qualquer texto para reescrevê-lo, formatá-lo ou utilizar a função de IA integrada (botão de raio/varinha mágica) para expandir ou resumir parágrafos instantaneamente.</li><li><b>Temas:</b> altere o design global da apresentação clicando no botão "Tema" no canto superior direito para testar estilos visuais diferentes com um único clique.</li></ul>
<h3>5. Exportando para PDF ou PowerPoint</h3><p>Para compartilhar seu material ou apresentá-lo offline:</p><ul><li><b>Passo 1:</b> no canto superior direito da tela, clique no menu de opções (ícone de três pontos ... ou botão Compartilhar / Share).</li><li><b>Passo 2:</b> selecione a opção Exportar (Export).</li><li><b>Passo 3:</b> escolha o formato desejado: Exportar para PDF (ideal para portfólios e leituras) ou Exportar para PowerPoint (.pptx) (caso precise realizar ajustes avançados no Microsoft PowerPoint).</li><li><b>Passo 4:</b> aguarde o processamento do arquivo e faça o download para o seu computador.</li></ul>
<div class="act"><button class="btn ghost" data-go="recursos">← Voltar aos recursos</button></div></div>`;

function guiaDua(){return `<h2>Mini-guia: o DUA em 1 página</h2><p class="sub">Desenho Universal para a Aprendizagem aplicado ao planejamento no SFAP</p><p>O <b>DUA</b> é uma forma de planejar em que as <b>diferentes maneiras de acessar, participar e mostrar o que se aprendeu já estão previstas desde o início</b>, em vez de serem adaptadas depois, caso a caso. Ele não é “uma aula para estudantes com deficiência”: as opções beneficiam toda a turma. A ideia central é <b>flexibilizar o caminho, não o objetivo</b> de aprendizagem.</p>${TB("Os três princípios do DUA",["Princípio","Pergunta-guia","Exemplo nos planos do SFAP"],[["Engajamento (o porquê)","Como despertar o interesse, sustentar o esforço e apoiar a autorregulação?","Metas visíveis por etapa, pausas e novas tentativas sem penalidade, pontuar esforço e não só velocidade (Artes Visuais)."],["Representação (o quê)","De quantas formas apresento a informação?","Roteiro em texto, áudio e vídeo com legenda; leitura prévia offline ou impressa (Administração, Serviços Públicos)."],["Ação e Expressão (o como)","De quantas formas o estudante pode mostrar o que aprendeu?","Entrega escrita, oral, em tabela ou protótipo físico, com rubrica que avalia o conteúdo e não o formato (Comunicação e Publicidade)."]])}<h3>Como usar em 3 passos</h3><ol><li><b>Fixe o objetivo.</b> Escreva o que o estudante precisa aprender e que <u>não</u> será flexibilizado.</li><li><b>Procure barreiras por princípio.</b> Onde a atividade depende só de ler? só de ouvir? só de um tipo de entrega? só de conexão ou de um computador bom?</li><li><b>Ofereça ao menos uma alternativa por princípio</b> e confira o box da Lente Inclusiva do plano. No Gerador, escolha até 3 estratégias por princípio; elas vão para o Resumo.</li></ol><div class="card"><h3>E o bloco “Infraestrutura das ECITs”?</h3><p>Ele <b>não é um princípio do DUA</b>: é uma adição do SFAP à realidade das escolas (computadores antigos, Wi-Fi instável). Reúne o plano B em papel, a versão offline e o uso pelo celular.</p></div><div class="lens"><h4>Quando o estudante tem deficiência ou neurodivergência</h4><p>O DUA não substitui o planejamento com o <b>AEE</b> (Atendimento Educacional Especializado). Use a Lente Inclusiva (box azul de cada plano) como ponto de partida e combine ajustes individuais com o AEE e a coordenação.</p></div><div class="act"><button class="btn ghost" data-go="tpack">← Conceito TPACK-R</button><button class="btn" data-go="dua">Ir às estratégias DUA →</button></div>`}
function conhecerTurma(){return `<h2>Como identificar as necessidades dos estudantes</h2><p class="sub">Orientação curta, sem exigir laudo e sem expor ninguém</p><p>A Lente Inclusiva sugere planejar com o AEE. Este passo a passo ajuda a <b>conhecer a turma antes de escolher as estratégias</b>. Os sinais abaixo são <b>pistas pedagógicas, não diagnóstico</b>.</p><h3>Em 5 passos</h3><ol><li><b>Converse com o AEE e a coordenação.</b> Pergunte o que ajuda cada estudante a participar, respeitando o sigilo. Você não precisa saber o diagnóstico para adaptar.</li><li><b>Aplique um questionário de entrada</b> (opcional e anônimo, no papel ou no celular). Sugestões: Que dispositivo você usa para estudar: celular, computador, nenhum? · Você tem internet em casa? Ela costuma funcionar bem? · Como você aprende melhor: lendo, ouvindo, vendo vídeo, fazendo junto? · O que ajuda você a manter o foco numa tarefa longa? · Há algo que devemos saber para a aula funcionar melhor para você? (opcional)</li><li><b>Observe a primeira semana</b> com o quadro abaixo.</li><li><b>Ofereça as opções para toda a turma</b> (“quem preferir pode...”), para que ninguém precise se identificar.</li><li><b>Revise ao longo do período.</b> As necessidades mudam; reveja o plano depois da primeira atividade.</li></ol>${TB("Sinais observados e o que considerar",["Se você observar...","Considere (princípio do DUA)"],[["Dificuldade com textos longos ou com leitura","Áudio narrado, resumo em tópicos, fonte ampliada e blocos curtos (Representação)"],["Cansaço, dispersão ou ansiedade em tarefas longas","Etapas curtas, checklist visível, pausas e aviso antes de mudar de etapa (Engajamento)"],["Dificuldade com mouse, teclado ou escrita","Atalhos, ditado por voz, trabalho em dupla, entrega oral ou física (Ação e Expressão)"],["Sem dispositivo ou sem internet","Material impresso ou offline, duplas com papéis alternados, celular no lugar do computador (Infraestrutura)"],["Incômodo com sons, luzes ou ambientes cheios","Aviso prévio, alternativa sem som, funções diferentes na atividade em grupo (Engajamento)"],["Dificuldade para acompanhar instruções faladas","Instruções por escrito e numeradas, legendas, exemplos prontos (Representação)"]])}<div class="lens"><h4>Cuidados</h4><ul><li>Não peça laudo nem pergunte diagnóstico diante da turma.</li><li>Não registre informações sensíveis no Resumo impresso.</li><li>Se uma barreira persistir, encaminhe ao AEE em vez de tentar resolvê-la sozinho(a).</li></ul></div><div class="act"><button class="btn ghost" data-go="guia-dua">← O que é o DUA?</button><button class="btn" data-go="gerador">Montar meu plano →</button></div>`}
function infografico(){return `<h2>Infográfico de consulta rápida</h2><p class="sub">O SFAP em uma página: fluxo de uso e as 5 dimensões do TPACK-R</p><h3>Como usar o SFAP em 6 passos</h3><ol class="flow"><li><b>Escolha o eixo</b><span>e o curso em Planos Prontos.</span></li><li><b>Plano pronto ou Gerador</b><span>leia o modelo ou monte o seu (Gerador de Plano).</span></li><li><b>Confira a Lente Inclusiva</b><span>e as estratégias DUA: Engajamento, Representação, Ação e Expressão.</span></li><li><b>Adapte à infraestrutura</b><span>plano B em papel, versão offline, celular.</span></li><li><b>Imprima o Resumo</b><span>use o botão Imprimir ou Ctrl+P (Cmd+P no Mac).</span></li><li><b>Aplique e avalie</b><span>registre o que funcionou e responda ao Protocolo em Fale Conosco.</span></li></ol><h3>As 5 dimensões do TPACK-R</h3><svg class="tpd" viewBox="0 0 360 345" role="img" aria-labelledby="tpt tpd1"><title id="tpt">Diagrama do TPACK Ressignificado</title><desc id="tpd1">Um círculo grande, Contexto Sociopolítico (CS), envolve quatro círculos menores: Conhecimento do Conteúdo (CC), Pedagógico (CP), Tecnológico (CT) e de Design (CD).</desc><circle cx="180" cy="165" r="150" fill="var(--l)" stroke="var(--g)" stroke-width="3"/><text x="180" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="var(--g)">CS — Contexto Sociopolítico</text><circle cx="140" cy="125" r="55" fill="var(--g)" stroke="var(--bg)" stroke-width="3"/><circle cx="220" cy="125" r="55" fill="var(--g)" stroke="var(--bg)" stroke-width="3"/><circle cx="140" cy="205" r="55" fill="var(--g)" stroke="var(--bg)" stroke-width="3"/><circle cx="220" cy="205" r="55" fill="var(--g)" stroke="var(--bg)" stroke-width="3"/><g font-size="22" font-weight="800" fill="var(--on)" text-anchor="middle"><text x="140" y="133">CC</text><text x="220" y="133">CP</text><text x="140" y="213">CT</text><text x="220" y="213">CD</text></g><text x="180" y="338" text-anchor="middle" font-size="11" fill="var(--m)">condições reais de trabalho, infraestrutura, emancipação</text></svg><ul><li><b>CC</b> Conteúdo: o saber técnico do eixo.</li><li><b>CP</b> Pedagógico: metodologia crítica (Pedagogia Histórico-Crítica).</li><li><b>CT</b> Tecnológico: ferramenta acessível e viável.</li><li><b>CD</b> Design: acessibilidade e DUA.</li><li><b>CS</b> Sociopolítico: envolve todas as demais.</li></ul><div class="lens"><h4>Lente Inclusiva: 3 perguntas antes de aplicar</h4><ul><li><b>[Engajamento]</b> Há metas visíveis, pausas e escolha?</li><li><b>[Representação]</b> O material existe em texto, áudio e vídeo com legenda?</li><li><b>[Ação e Expressão]</b> O estudante pode mostrar o que aprendeu de mais de um jeito?</li></ul></div><div class="act noprint"><button class="btn ghost" data-go="home">← Início</button><button class="btn" id="pr">Imprimir infográfico</button></div>`}
function tpackExtra(){return `<h3>Guias de apoio</h3>${apoioBtns()}<h3>Exemplo: as 5 dimensões no plano de Administração</h3>${TB("Exemplo das cinco dimensões",["Dimensão","No plano","Pergunta para conferir o seu"],[["CC Conteúdo","Fluxo de processo (BPMN) e planilhas de controle de estoque.","O que o estudante precisa dominar?"],["CP Pedagógico","Comparar gestão tradicional e Economia Solidária; discutir quem controla o processo e por quê.","Que problema real ou crítica move a aula?"],["CT Tecnológico","LibreOffice Calc ou Google Sheets, com modelo pronto.","A ferramenta é acessível, gratuita e funciona na escola?"],["CD Design (DUA)","Legenda dupla cor + texto; tutorial em texto e vídeo curto.","Quais caminhos alternativos são oferecidos?"],["CS Sociopolítico","Pressão por formação operacional (teleatendimento) versus direitos trabalhistas e função social da gestão.","Que condições reais de trabalho, infraestrutura e desigualdades atravessam a aula?"]])}<p><b>Leitura rápida:</b> o CS não é a quinta peça ao lado das outras; ele <b>envolve</b> as demais. A mesma ferramenta (CT) pode servir à emancipação ou à mera adaptação ao mercado, conforme o contexto e a intencionalidade (CP).</p><div class="card"><h3>Classe, gênero e dualidade estrutural</h3><p><b>Classe:</b> condições materiais (renda, dispositivo, conexão, necessidade de trabalhar) que afetam o acesso e a permanência.</p><p><b>Gênero:</b> como a divisão social do trabalho e as representações associam profissões e papéis a homens e mulheres, inclusive nos cursos técnicos.</p><p><b>Dualidade estrutural:</b> separação histórica, discutida na literatura crítica da educação profissional brasileira, entre uma formação voltada a planejar e dirigir e outra voltada a executar tarefas operacionais. Cada plano traz, no item CS, uma frase e uma pergunta para a roda sobre esses temas.</p></div><h3>Glossário</h3>${TB("Glossário do SFAP",["Termo","Significado"],[["TPACK","Technological Pedagogical Content Knowledge (Mishra &amp; Koehler, 2006): integração entre conteúdo, pedagogia e tecnologia."],["TPACK-R","TPACK Ressignificado: acrescenta o Contexto Sociopolítico (CS) como dimensão que atravessa as demais e inclui o Design (CD) ligado ao DUA."],["TDIC","Tecnologias Digitais da Informação e Comunicação."],["DUA","Desenho Universal para a Aprendizagem (ver mini-guia)."],["Lente Inclusiva","Box de orientações do SFAP para estudantes neurodivergentes e PcD, marcadas por princípio do DUA."],["AEE","Atendimento Educacional Especializado."],["PHC","Pedagogia Histórico-Crítica (Saviani, 2008): parte da prática social, problematiza e retorna a ela com o conhecimento sistematizado."],["DCN-EPT","Diretrizes Curriculares Nacionais para a Educação Profissional e Tecnológica (Res. CNE/CP nº 1/2021)."],["ECIT","Escola Cidadã Integral Técnica."],["ABP","Aprendizagem Baseada em Problemas ou em Projetos (os planos indicam qual das duas)."],["Sala de aula invertida","O estudo do conteúdo ocorre antes da aula; o encontro é usado para discutir e aplicar."],["Peer instruction","Instrução por pares: estudantes explicam e discutem entre si a partir de questões do professor."],["Live coding","O professor programa ao vivo, comentando o raciocínio, enquanto a turma acompanha."],["Dualidade estrutural","Separação histórica entre formação para planejar e dirigir e formação para executar tarefas."],["Letramento digital desigual","Diferenças de domínio de ferramentas digitais dentro da mesma turma."],["Plano B","Alternativa sem conexão ou sem computador (papel, offline, celular) para a mesma atividade."]])}`}

const tutColab=()=>`<div class="tut"><h2>Tutorial Prático: Google Colab</h2><p class="sub">Guia passo a passo para escrever, executar e compartilhar código Python no navegador, sem instalar nada.</p>
<h3>1. O que é o Google Colab?</h3><p>O Google Colab (Colaboratory) é um ambiente gratuito para escrever e executar código Python direto no navegador. O processamento acontece nos servidores do Google, o que ajuda em laboratórios com computadores limitados.</p><div class="callout"><b>Objetivo deste tutorial:</b> capacitar docentes da EPT a criar um caderno (notebook), executar código, compartilhar com a turma e montar uma atividade simples de programação.</div><div class="callout"><b>Atenção:</b> a interface do Colab muda com o tempo. Se um menu estiver em outro lugar, procure pelo nome do recurso.</div>
<h3>2. Antes de começar</h3><ul><li><b>Conta:</b> uma conta Google para o professor e para cada aluno.</li><li><b>Navegador:</b> Chrome, Edge ou Firefox atualizados, com internet.</li><li><b>Teste prévio:</b> acesse colab.research.google.com na rede da escola antes da aula.</li></ul>
<h3>3. Criando seu primeiro caderno</h3><ul><li><b>Passo 1:</b> acesse colab.research.google.com e entre com sua conta Google.</li><li><b>Passo 2:</b> clique em <b>Novo notebook</b>.</li><li><b>Passo 3:</b> clique no nome do arquivo no topo e renomeie, por exemplo: “Aula 01 - Variáveis e condicionais”.</li></ul><p>O caderno é formado por células: as de <b>código</b> executam o Python e as de <b>texto</b> trazem enunciados e instruções. Use os botões <b>+ Código</b> e <b>+ Texto</b> para adicionar células.</p>
<h3>4. Executando código</h3><p>Em uma célula de código, digite:</p><pre><code>nome = "Maria"
print("Olá,", nome)</code></pre><p>Clique no botão de play ao lado da célula ou use <b>Ctrl + Enter</b>. O resultado aparece abaixo. Na primeira execução, o Colab leva alguns segundos para conectar a uma máquina.</p><p><b>Exemplo de atividade (condicionais):</b></p><pre><code>nota1 = float(input("Digite a nota 1: "))
nota2 = float(input("Digite a nota 2: "))
media = (nota1 + nota2) / 2
if media &gt;= 7:
    print("Aprovado, média:", media)
else:
    print("Em recuperação, média:", media)</code></pre><p>Monte a atividade em três células: o problema (texto), o exemplo (código) e uma célula em branco para o aluno resolver uma variante.</p>
<h3>5. Bibliotecas e arquivos</h3><ul><li>Bibliotecas comuns (pandas, matplotlib) já vêm instaladas: <code>import pandas as pd</code>.</li><li>Instalar outra biblioteca: use <code>!pip install nome-da-biblioteca</code> em uma célula.</li><li><b>Arquivo avulso:</b> clique no ícone de pasta, na barra lateral esquerda, e arraste o arquivo (por exemplo, um .csv).</li><li><b>Google Drive:</b> execute <code>from google.colab import drive</code> e depois <code>drive.mount('/content/drive')</code>, e autorize o acesso.</li></ul><div class="callout"><b>Atenção:</b> arquivos enviados direto para a sessão somem quando ela termina. Para guardar, use o Google Drive.</div>
<h3>6. Salvando e compartilhando com a turma</h3><ul><li><b>Passo 1:</b> o caderno é salvo automaticamente no seu Google Drive.</li><li><b>Passo 2:</b> clique em <b>Compartilhar</b> e escolha <b>Qualquer pessoa com o link</b> com acesso de <b>Leitor</b>.</li><li><b>Passo 3:</b> oriente os alunos a usar <b>Arquivo &gt; Salvar uma cópia no Drive</b> e trabalhar na própria cópia.</li><li><b>Passo 4:</b> para trabalho em dupla, dê acesso de <b>Editor</b> apenas aos integrantes.</li><li><b>Passo 5:</b> peça que o aluno compartilhe com você o link da cópia para entregar a atividade.</li></ul>
<h3>7. Limites da execução</h3><ul><li>Para executar tudo de uma vez, use <b>Ambiente de execução &gt; Executar tudo</b>.</li><li>Se der erro ao reabrir o caderno, execute as células de cima para baixo: as variáveis somem quando a sessão termina.</li><li>A sessão desconecta após um período de inatividade, e o plano gratuito tem limites de uso. Evite aulas que dependam de sessões muito longas.</li></ul>
<h3>8. Sugestão de aula de 50 minutos</h3>${TB("Sugestão de aula de 50 minutos",["Tempo","Atividade"],[["0 a 10 min","Apresentar o problema e abrir o caderno compartilhado."],["10 a 20 min","Demonstração com o código de exemplo."],["20 a 40 min","Alunos em duplas resolvem a variante na própria cópia."],["40 a 50 min","Compartilhar soluções e discutir os erros mais comuns."]])}
<h3>9. Acessibilidade e DUA</h3>${TB("Acessibilidade e DUA no Colab",["Princípio","Como aplicar no Colab"],[["Representação","Enunciado em células de texto com linguagem clara; aumente a fonte e o zoom do navegador (Ctrl +) e use o modo escuro em Ferramentas &gt; Configurações. O Colab funciona com leitores de tela."],["Ação e Expressão","Deixe o aluno escolher entre responder em código ou explicar o raciocínio em uma célula de texto."],["Engajamento","Use problemas próximos do curso: estoque, vendas, notas, pontuação de jogo."]])}
<h3>10. Problemas frequentes</h3>${TB("Problemas frequentes no Colab",["Problema","O que fazer"],[["Não conecta ou a página não abre","Confira a internet e se a rede da escola libera o endereço. Tente outro navegador."],["NameError (variável não definida)","Execute as células anteriores, de cima para baixo."],["ModuleNotFoundError","Instale a biblioteca com !pip install e execute de novo."],["Arquivo enviado sumiu","A sessão reiniciou. Guarde no Google Drive."],["Aluno sem conta Google","Use uma conta da escola ou faça a atividade em dupla com quem tem conta."]])}
<h3>11. Checklist antes da aula</h3><ul><li>Testei o acesso ao Colab na rede da escola.</li><li>O caderno está compartilhado como Leitor, com o link visível para a turma.</li><li>Executei cada célula de exemplo sem erro e deixei uma célula em branco para o aluno.</li><li>Tenho um plano B (atividade impressa ou editor offline) caso a internet falhe.</li></ul>

const tutCapcut=()=>`<div class="tut"><h2>Tutorial Prático: CapCut</h2><p class="sub">Guia passo a passo para produzir videoaulas e tutoriais curtos (até 5 minutos), com legendas e acessibilidade.</p>
<h3>1. O que é o CapCut?</h3><p>O CapCut é um editor de vídeo gratuito, disponível para celular, computador e navegador. Permite cortar trechos, inserir legendas automáticas, destacar telas e exportar o vídeo pronto para a turma.</p><div class="callout"><b>Objetivo deste tutorial:</b> capacitar docentes da EPT a produzir uma videoaula ou um tutorial de até 5 minutos, desde o acesso até a exportação final.</div><div class="callout"><b>Atenção:</b> a interface do CapCut muda com frequência, e alguns recursos podem variar no plano gratuito. Se um nome de menu for diferente, procure o ícone equivalente.</div>
<h3>2. Antes de começar</h3><ul><li><b>Conta:</b> crie uma conta gratuita com e-mail, Google ou TikTok.</li><li><b>Materiais:</b> gravação de tela ou da aula, imagens e slides exportados como imagem ou vídeo.</li><li><b>Áudio:</b> fones de ouvido ou microfone simples, em ambiente silencioso.</li><li><b>Roteiro mínimo:</b> objetivo (o que o aluno saberá fazer), abertura de 15 s, desenvolvimento em no máximo 3 passos e fechamento de 30 s.</li></ul>
<h3>3. Acessando e criando o projeto</h3><ul><li><b>Passo 1:</b> no celular, instale o aplicativo CapCut; no computador, instale a versão desktop ou use a versão web.</li><li><b>Passo 2:</b> faça login e toque em <b>Novo projeto</b>.</li><li><b>Passo 3:</b> selecione vídeos, imagens e gravações de tela e confirme em <b>Adicionar</b>.</li><li><b>Passo 4:</b> os arquivos aparecem na <b>linha do tempo</b>, a faixa na parte de baixo da tela.</li></ul>
<h3>4. Cortando e organizando</h3><ul><li><b>Passo 1:</b> arraste os trechos para a ordem do roteiro.</li><li><b>Passo 2:</b> posicione o cursor (linha branca) onde quer cortar e toque em <b>Dividir</b>.</li><li><b>Passo 3:</b> selecione o pedaço que não serve e toque em <b>Excluir</b>.</li><li><b>Passo 4:</b> remova silêncios longos e erros de fala.</li></ul><div class="callout"><b>Dica:</b> vídeos curtos e diretos, com um único objetivo, são mais fáceis de acompanhar e de reaproveitar em outras turmas.</div>
<h3>5. Legendas e destaques</h3><ul><li><b>Legendas automáticas:</b> toque em <b>Texto</b>, depois em <b>Legendas automáticas</b>, e escolha <b>Português (Brasil)</b>.</li><li><b>Revisão:</b> leia a legenda inteira. A geração automática erra nomes de ferramentas e siglas técnicas.</li><li><b>Estilo:</b> use fonte legível, tamanho grande e contraste alto (letra branca com contorno ou fundo escuro).</li><li><b>Destaques:</b> use texto na tela para nomear cada passo, zoom nas partes da tela em que você clica, e setas ou formas para apontar botões.</li><li><b>Velocidade:</b> acelere trechos repetitivos em <b>Velocidade</b>.</li></ul>
<h3>6. Áudio</h3><ul><li>Em <b>Áudio</b>, use <b>Extrair</b> para separar a voz de um vídeo.</li><li>Se usar música de fundo, deixe o volume baixo (cerca de 10% a 20%).</li><li>Use a redução de ruído, se estiver disponível.</li></ul>
<h3>7. Exportando e compartilhando</h3><ul><li><b>Passo 1:</b> toque em <b>Exportar</b>, no canto superior.</li><li><b>Passo 2:</b> escolha resolução 1080p e 30 fps. Se o arquivo ficar pesado, use 720p.</li><li><b>Passo 3:</b> salve o vídeo no aparelho.</li><li><b>Passo 4:</b> envie para o Google Drive, o YouTube (como “não listado”) ou o WhatsApp da turma.</li></ul>
<h3>8. Acessibilidade e DUA</h3>${TB("Acessibilidade e DUA no vídeo",["Princípio","Como aplicar no vídeo"],[["Representação","Legendas revisadas, texto na tela e destaque visual do que está sendo explicado."],["Ação e Expressão","Entregue também um roteiro em texto ou PDF com os mesmos passos."],["Engajamento","Vídeo curto, com uma pergunta ou tarefa prática ao final."]])}
<h3>9. Problemas frequentes</h3>${TB("Problemas frequentes no CapCut",["Problema","O que fazer"],[["Legenda não aparece em português","Troque o idioma antes de gerar e gere de novo."],["Marca d'água ou clipe final no vídeo","Remova o clipe final na linha do tempo, quando permitido, ou verifique as condições do plano gratuito."],["Áudio baixo","Aumente o volume do clipe de voz ou use a normalização de áudio, se houver."],["Arquivo muito pesado","Exporte em 720p e 30 fps."],["Aplicativo trava","Libere espaço no aparelho, feche outros apps e atualize o CapCut."]])}
<h3>10. Checklist antes de publicar</h3><ul><li>O vídeo tem até 5 minutos e um único objetivo.</li><li>A legenda foi revisada por inteiro e o texto na tela é legível.</li><li>O áudio está claro e há uma tarefa curta ao final.</li><li>Existe um roteiro em texto para quem não puder assistir ao vídeo.</li><li>Imagens, músicas e vozes de terceiros respeitam os direitos de uso e a autorização das pessoas que aparecem.</li></ul>
